      let files = gitFiles;

        {

          (t) => !state.openOnly || !t.resolved,
        );
        return `<div class="shell">${topbar(true)}<div class="layout ${state.panel ? "" : "no-threads"}"><aside class="pane files" aria-label="Review files"><header class="pane-title"><h2>${isDirectory() ? "Files" : "Changed files"}</h2>${badge(files.length)}</header><div class="tools"><input class="wide" id="file-filter" aria-label="Filter files" placeholder="Filter files…" value="${esc(state.filter)}"></div><nav class="tree scroll" aria-label="File tree">${tree()}</nav><div class="file-footer">${isDirectory() ? "3 supported text files<br>I Ignored / excluded · F File · ✓ Viewed" : `<span class="green">+85</span> <span class="red">−23</span> across 6 files<br>M Modified · A Added · I Ignored · ✓ Viewed`}</div></aside><main class="pane"><div class="file-top"><b>${esc(state.path)}</b><span class="spacer"></span><label style="font-size:10px;white-space:nowrap"><input type="checkbox" id="viewed" ${state.viewed.has(state.path) ? "checked" : ""}> Viewed</label>${btn("＋ File comment", "file-comment", "", readOnly() ? "disabled" : "")}</div><div class="diff-controls"><div>${f.status === "missing" ? `<span class="muted">File unavailable · thread kept in review</span>` : isDirectory() || f.status === "I" ? `<span class="muted">${f.status === "I" ? "Ignored / excluded file" : "Text file"} · snapshot review</span>` : `<span class="green">+${f.add}</span> <span class="red">−${f.del}</span> <span class="muted" style="margin-left:8px">${f.status === "A" ? "Added" : "Modified"}</span>`}</div><div class="segments" role="group" aria-label="Diff layout">${(isDirectory() || f.status === "I" ? ["file"] : ["stacked", "split", "file"]).map((m) => btn(m === "stacked" ? "Stacked" : m === "split" ? "Side by side" : "Full file", "mode", state.mode === m ? "active" : "", `data-mode="${m}" aria-pressed="${state.mode === m}"`)).join("")}</div></div><div class="scroll" id="diff-scroll"><div class="diff">${diffMarkup()}</div>${composer()}${state.threads
          .filter((t) => t.path === state.path && t.line === null)
          .map(
            (t) =>
              `<div style="padding:12px"><div class="eyebrow">File discussion</div>${threadMarkup(t)}</div>`,
          )
          .join(
            "",
          )}<div style="padding:16px 12px;color:#64748b;font-size:10px">${state.closed ? "This local review is closed. Start a new review for further changes." : state.submitted && !state.local ? "Review submitted. Comments are read-only in this prototype." : "Use + beside a line to comment. Shift-click to select multiple lines."}</div></div></main>${state.panel ? `<aside id="threads-panel" class="pane threads" aria-label="Threads across all files"><header class="pane-title"><h2>Threads · all files</h2>${btn("‹", "panel", "quiet", 'aria-label="Collapse threads"')}</header><div class="thread-filter"><span>${threads.length} threads across ${new Set(threads.map((t) => t.path)).size} files</span><label><input type="checkbox" id="open-only" ${state.openOnly ? "checked" : ""}> Open only</label></div><div class="identity"><label>Commenting as <select id="actor" aria-label="Review author identity" style="padding:3px;font-size:10px"><option value="human-sam" ${state.actor.kind === "human" ? "selected" : ""}>Sam · Human</option><option value="agent-codex" ${state.actor.kind === "agent" ? "selected" : ""}>Codex · Agent</option></select></label><p style="font-size:9px;margin-top:4px">${state.actor.kind === "agent" && !state.local ? "GitHub posting account: Sam · LGTM keeps agent attribution" : "LGTM keeps the author identity on each comment"}</p></div><div class="thread-list scroll">${threads.map(threadMarkup).join("") || '<div class="empty">No open threads.<br>Turn off Open only to see resolved discussion.</div>'}</div></aside>` : ""}</div><footer class="statusbar"><span>${state.local ? "Local review · never published to GitHub" : "GitHub PR · e4f8c20 · draft comments stay private"}</span><span>${state.local ? "Save review to keep your notes" : "Submit review to publish pending comments"}</span><span>${esc(state.actor.name)} · ${state.actor.kind}</span></footer></div>`;
      }
      function render() {
        app.innerHTML = DOMPurify.sanitize(
          state.screen === "start" ? start() : review(),
        );
        window.HSStaticMethods?.autoInit();
      }
      function showDialog(title, body, actions) {
        dialog.innerHTML = DOMPurify.sanitize(
          `<header class="dialog-head"><h2 id="dialog-title">${title}</h2>${btn("×", "close-dialog", "quiet", 'aria-label="Close dialog"')}</header><div class="dialog-content">${body}</div><footer class="dialog-actions">${actions}</footer>`,
        );
        dialog.showModal();
      }
      function showPulls() {
        showDialog(
          "Choose a pull request",
          `<p>Open pull requests in difflab-io/lgtm</p><input id="pr-search" class="wide" aria-label="Search pull requests" placeholder="Search by title or number…"><div class="pr-list" id="pr-list">${pullOptions("")}</div><p class="muted" style="font-size:10px;margin-top:12px">Draft pull requests can be reviewed. This list uses sample data.</p>`,
          btn("Cancel", "close-dialog"),
        );
      }
      function pullOptions(q) {
        return (
          pulls
            .filter((p) =>
              `${p.id} ${p.title}`.toLowerCase().includes(q.toLowerCase()),
            )
            .map(
              (p) =>
                `<button class="pr-option" data-pr="${p.id}"><span><b>#${p.id} · ${esc(p.title)}</b><small>${esc(p.author)} · ${esc(p.branch)}</small></span>${badge(p.draft ? "Draft" : "Open", p.draft ? "" : "green")}</button>`,
            )
            .join("") || '<div class="empty">No matching pull requests.</div>'
        );
      }
      function showSubmit() {
        const local = state.local;
        showDialog(
          local ? "Save local review" : "Submit review",
          `<p>${local ? `${localTitle()} · ${state.scope === "directory" ? esc(state.directory) : "feature/standalone-web"}` : `difflab-io/lgtm #${state.pr.id}`}<br>${draftCount()} ${local ? "local notes to save" : "pending comments to publish"} · ${state.viewed.size} / ${files.length} files viewed</p><label class="field"><span>Overall comment ${local ? "(optional)" : ""}</span><textarea id="summary" rows="3" aria-label="Overall review comment" placeholder="Summarize your review…"></textarea></label>${local ? '<div class="notice"><b>Local review only.</b> Your summary and notes are saved on this machine. You can resume this review later.</div>' : `<fieldset style="border:0;margin:14px 0 0;padding:0"><legend style="margin-bottom:2px;font-weight:600">Review outcome</legend><label class="outcome"><input type="radio" name="outcome" value="comment" checked><b>Comment</b><small>Share feedback without approving or rejecting.</small></label><label class="outcome"><input type="radio" name="outcome" value="approve"><b>Approve</b><small>The changes are ready to merge.</small></label><label class="outcome"><input type="radio" name="outcome" value="reject"><b>Request changes</b><small>Reject until the required changes are addressed.</small></label></fieldset><div class="notice">File comments and notes outside diff hunks are included in the overall review summary.</div>`}<p id="submit-error" role="alert" class="red" style="margin-top:8px"></p>`,
          btn("Cancel", "close-dialog") +
            btn(local ? "Save locally" : "Submit review", "finish", "primary"),
        );
      }
      function notify(message) {
        document.getElementById("feedback").innerHTML =
          `<div class="toast">${esc(message)}</div>`;
        setTimeout(
          () => document.getElementById("feedback").replaceChildren(),
          3500,
        );
      }
      function addComment(line = null, side = "RIGHT", end = null) {
        if (readOnly()) return;
        state.composer = { line, side, end };
        render();
        document.querySelector("#comment-form textarea")?.focus();
        document
          .getElementById("comment-form")
          ?.scrollIntoView({ block: "nearest" });
      }
      function navigate() {
        dialog.close();
        const hash = location.hash.slice(1);
        state.screen = hash === "start" || !hash ? "start" : "review";
        state.local = hash.startsWith("local");
        if (hash.startsWith("local-directory")) state.scope = "directory";
        else if (state.local && state.scope === "directory")
          state.scope = "worktree";
        if (hash === "local-ignored") state.includeIgnored = true;
        const directory = isDirectory();
        if (directory && files !== directoryFiles)
          state.threads = structuredClone(directoryThreads);
        else if (!directory && files === directoryFiles)
          state.threads = structuredClone(initialThreads);
        files = directory
          ? directoryFiles
          : state.local && state.includeIgnored
            ? [...gitFiles, ignoredFile]
            : gitFiles;
        state.mode = isDirectory()
          ? "file"
          : hash === "split"
            ? "split"
            : "stacked";
        state.panel = hash !== "collapsed";
        if (hash === "review-agent") {
          state.actor = { id: "agent-codex", name: "Codex", kind: "agent" };
          state.openOnly = false;
        }
        state.context = hash === "context";
        state.composer =
          hash === "file-comment"
            ? {
                line: null,
                body: "Could we document how rename anchors behave for both diff sides?",
              }
            : null;
        state.expanded = hash === "thread" ? 1 : null;
        state.submitted = false;
        state.closed = hash === "local-closed";
        state.path = files[0].path;
        if (state.local)
          state.session = isDirectory()
            ? `Agent plans · ${state.directory}`
            : `${localTitle()} · feature/standalone-web`;
        if (hash === "local-orphans") {
          state.threads = [
            {
              id: 5,
              path: files[0].path,
              line: null,
              formerLine: 44,
              author: "Codex",
              kind: "agent",
              body: "The old line could not be matched. Keep this feedback at file level.",
              replies: [],
              resolved: false,
              draft: true,
            },
            {
              id: 6,
              path: ".plans/retired-plan.md",
              line: null,
              missing: true,
              formerLine: 12,
              author: "Sam",
              kind: "human",
              body: "This plan was removed. Keep the discussion in this review.",
              replies: [],
              resolved: false,
              draft: true,
            },
          ];
        }
        render();
        if (state.composer)
          document
            .getElementById("comment-form")
            ?.scrollIntoView({ block: "nearest" });
        if (hash === "local-sessions") {
          state.screen = "start";
          render();
          showSessions();
        }
        if (hash === "directory-picker") {
          state.screen = "start";
          state.scope = "directory";
          render();
          showDirectory();
        }
        if (hash === "pulls") {
          state.screen = "start";
          render();
          showPulls();
        }
        if (
          hash === "submit" ||
          hash === "local-save" ||
          hash === "local-directory-save"
        )
          showSubmit();
      }
      window.addEventListener("hashchange", navigate);
      document.addEventListener("click", (e) => {
        const file = e.target.closest("[data-file]");
        if (file) {
          state.path = file.dataset.file;
          state.composer = null;
          state.context = false;
          render();
          return;
        }
        const thread = e.target.closest("[data-thread]");
        if (thread) {
          const id = Number(thread.dataset.thread);
          state.expanded = state.expanded === id ? null : id;
          state.path = state.threads.find((t) => t.id === id).path;
          state.composer = null;
          render();
          return;
        }
        const session = e.target.closest("[data-session]");
        if (session) {
          const chosen = sessions.find((x) => x.id === session.dataset.session);
          state.session = chosen.title;
          dialog.close();
          if (location.hash === "#" + chosen.hash) navigate();
          else location.hash = chosen.hash;
          return;
        }
        const pr = e.target.closest("[data-pr]");
        if (pr) {
          state.pr = pulls.find((p) => p.id === Number(pr.dataset.pr));
          dialog.close();
          location.hash = "review";
          return;
        }
        const line = e.target.closest("[data-line]");
        if (line) {
          const n = Number(line.dataset.line);
          if (
            e.shiftKey &&
            state.composer?.line &&
            state.composer.side === line.dataset.side
          ) {
            const start = Math.min(state.composer.line, n),
              end = Math.max(state.composer.line, n);
            state.range = [start, end];
            addComment(start, line.dataset.side, end);
          } else {
            state.range = null;
            addComment(n, line.dataset.side);
          }
          return;
        }
        const button = e.target.closest("[data-action]");
        if (!button) return;
        switch (button.dataset.action) {
          case "inline-thread":
            state.expanded = Number(button.dataset.id);
            state.panel = true;
            render();
            document
              .getElementById("thread-" + state.expanded)
              ?.scrollIntoView({ block: "nearest" });
            break;
          case "start-local":
            if (state.scope === "directory") showDirectory();
            else location.hash = "local";
            break;
          case "sessions":
            showSessions();
            break;
          case "close-local":
            showDialog(
              "Close local review",
              '<p>Closing marks this review session as complete. Save the notes and overall summary, then keep the review in history.</p><div class="notice">' +
                state.threads.filter((t) => !t.resolved).length +
                " open threads remain. Closing preserves them and their discussion. It does not approve changes or publish to GitHub.</div>",
              btn("Keep reviewing", "close-dialog") +
                btn("Save and close review", "finish-close", "primary"),
            );
            break;
          case "finish-close":
            state.closed = true;
            state.composer = null;
            dialog.close();
            render();
            notify("Local review saved and closed · prototype only");
            break;
          case "new-local":
            location.hash = "start";
            break;
          case "open-directory": {
            const path = document.getElementById("directory-path").value.trim();
            if (!path) {
              document.getElementById("directory-path").focus();
              return;
            }
            state.directory = path;
            dialog.close();
            location.hash = "local-directory";
            break;
          }
          case "pulls":
            showPulls();
            break;
          case "close-dialog":
            dialog.close();
            break;
          case "panel":
            state.panel = !state.panel;
            render();
            break;
          case "mode":
            state.mode = button.dataset.mode;
            render();
            break;
          case "context":
            state.context = !state.context;
            render();
            break;
          case "file-comment":
            addComment();
            break;
          case "cancel-comment":
            state.composer = null;
            state.range = null;
            render();
            break;
          case "submit":
            showSubmit();
            break;
          case "resolve": {
            const t = state.threads.find(
              (t) => t.id === Number(button.dataset.id),
            );
            t.resolved = !t.resolved;
            render();
            break;
          }
          case "preview": {
            const text = document.querySelector("#comment-form textarea");
            document.getElementById("comment-preview").innerHTML =
              DOMPurify.sanitize(
                esc(text.value)
                  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                  .replace(/`([^`]+)`/g, "<code>$1</code>"),
              );
            document.getElementById("comment-preview").hidden = false;
            text.hidden = true;
            break;
          }
          case "write":
            document.querySelector("#comment-form textarea").hidden = false;
            document.getElementById("comment-preview").hidden = true;
            break;
          case "finish": {
            const summary = document.getElementById("summary").value.trim();
            const outcome = document.querySelector(
              "input[name=outcome]:checked",
            )?.value;
            if (
              !state.local &&
              (outcome === "reject" ||
                (outcome === "comment" && !draftCount())) &&
              !summary
            ) {
              document.getElementById("submit-error").textContent =
                "Add an overall comment before submitting this outcome.";
              document.getElementById("summary").focus();
              return;
            }
            dialog.close();
            if (!state.local) {
              state.submitted = true;
              state.threads.forEach((t) => (t.draft = false));
            }
            render();
            notify(
              state.local
                ? "Local review saved · prototype only"
                : `Review ${outcome === "approve" ? "approved" : outcome === "reject" ? "submitted with requested changes" : "submitted"} · prototype only`,
            );
            break;
          }
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "file-filter") {
          state.filter = e.target.value;
          document.querySelector(".tree").innerHTML =
            DOMPurify.sanitize(tree());
        }
        if (e.target.id === "session-search")
          document.getElementById("session-list").innerHTML =
            DOMPurify.sanitize(sessionOptions(e.target.value));
        if (e.target.id === "pr-search")
          document.getElementById("pr-list").innerHTML = DOMPurify.sanitize(
            pullOptions(e.target.value),
          );
        if (e.target.closest("#comment-form") && e.target.name === "comment")
          state.composer.body = e.target.value;
      });
      document.addEventListener("change", (e) => {
        if (e.target.name === "scope") state.scope = e.target.value;
        if (e.target.id === "actor")
          state.actor =
            e.target.value === "agent-codex"
              ? { id: "agent-codex", name: "Codex", kind: "agent" }
              : { id: "human-sam", name: "Sam", kind: "human" };
        if (e.target.id === "actor") render();
        if (e.target.id === "include-ignored")
          state.includeIgnored = e.target.checked;
        if (e.target.id === "viewed") {
          if (e.target.checked) state.viewed.add(state.path);
          else state.viewed.delete(state.path);
          render();
        }
        if (e.target.id === "open-only") {
          state.openOnly = e.target.checked;
          render();
        }
      });
      document.addEventListener("submit", (e) => {
        e.preventDefault();
        if (e.target.id === "comment-form") {
          const body = new FormData(e.target).get("comment").trim();
          if (!body) return;
          state.threads.unshift({
            id: Date.now(),
            path: state.path,
            ...state.composer,
            body,
            author: state.actor.name,
            kind: state.actor.kind,
            actorId: state.actor.id,
            draft: true,
            resolved: false,
            replies: [],
          });
          state.composer = null;
          state.range = null;
          state.panel = true;
          render();
          notify(
            state.local
              ? "Local note saved · prototype only"
              : "Comment added to pending review",
          );
        }
        if (e.target.dataset.reply) {
          const t = state.threads.find(
            (t) => t.id === Number(e.target.dataset.reply),
          );
          const body = new FormData(e.target).get("reply").trim();
          if (!body) return;
          t.replies.push({
            author: state.actor.name,
            kind: state.actor.kind,
            actorId: state.actor.id,
            body,
          });
          render();
          notify("Reply added · prototype only");
        }
      });
      document.addEventListener("keydown", (e) => {
        if (
          (e.metaKey || e.ctrlKey) &&
          e.key === "Enter" &&
          e.target.closest("#comment-form")
        ) {
          e.preventDefault();
          e.target.closest("form").requestSubmit();
        }
      });
      navigate();
    </script>
  </body>
</html>
