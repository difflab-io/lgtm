<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 76" width="296" height="76" role="img" aria-label="LGTM compact split diff brand logo (+LG|TM-)">
  <defs>
    <clipPath id="split-clip">
      <rect x="0" y="0" width="296" height="76" rx="16" />
    </clipPath>
    <style>
      .word-add {
        font-family: 'Inter Display', Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: -2px;
        fill: #064e3b;
        text-anchor: middle;
      }
      .word-del {
        font-family: 'Inter Display', Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 54px;
        font-weight: 800;
        letter-spacing: -2px;
        fill: #881337;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g clip-path="url(#split-clip)">
    <!-- Left Pane: [+ Rail | LG] -->
    <rect x="0" y="0" width="148" height="76" fill="#dcfce7" />
    <rect x="0" y="0" width="46" height="76" fill="#86efac" />

    <!-- Right Pane: [TM | - Rail] -->
    <rect x="148" y="0" width="148" height="76" fill="#ffe4e6" />
    <rect x="250" y="0" width="46" height="76" fill="#fda4af" />
  </g>

  <!-- + Sign inside Left Rail (center 23, 38) -->
  <g fill="#14532d">
    <rect x="11" y="34.5" width="24" height="7" />
    <rect x="19.5" y="26" width="7" height="24" />
  </g>

  <!-- - Sign inside Right Rail (center 273, 38) -->
  <rect x="261" y="34.5" width="24" height="7" fill="#881337" />

  <!-- Code Panes: LG (center of 46..148 = 97) and TM (center of 148..250 = 199) -->
  <text x="97" y="57" class="word-add">LG</text>
  <text x="199" y="57" class="word-del">TM</text>
</svg>
