<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 140" width="168" height="140" role="img" aria-label="lgtm compact stacked diff logo (+lg / -tm)">
  <defs>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="168" height="140" rx="22" />
    </clipPath>
    <style>
      .word-add {
        font-family: 'Inter Display', Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 58px;
        font-weight: 800;
        letter-spacing: -2px;
        fill: #064e3b;
        text-anchor: middle;
      }
      .word-del {
        font-family: 'Inter Display', Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 58px;
        font-weight: 800;
        letter-spacing: -2px;
        fill: #881337;
        text-anchor: middle;
      }
    </style>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Line 1: +lg -->
    <rect x="0" y="0" width="168" height="70" fill="#dcfce7" />
    <rect x="0" y="0" width="52" height="70" fill="#86efac" />

    <!-- Line 2: -tm -->
    <rect x="0" y="70" width="168" height="70" fill="#ffe4e6" />
    <rect x="0" y="70" width="52" height="70" fill="#fda4af" />
  </g>

  <!-- + Sign inside Addition Rail (center 26, 35) -->
  <g fill="#14532d">
    <rect x="14" y="31.5" width="24" height="7" />
    <rect x="22.5" y="23" width="7" height="24" />
  </g>

  <!-- - Sign inside Deletion Rail (center 26, 105) -->
  <rect x="14" y="101.5" width="24" height="7" fill="#881337" />

  <!-- Code Area Letters (center of 52..168 = 110) -->
  <text x="110" y="51" class="word-add">lg</text>
  <text x="110" y="123" class="word-del">tm</text>
</svg>
