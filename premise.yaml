workspace:
    name: lgtm
    kind: monorepo
    schema-version: "0.2"
    package_managers:
        - cargo
        - bun
    providers:
        ci: github
        tools: mise
        tasks: mise
        infra: none
        versioning: svu
    projects:
        - name: lgtm-cli
          template: cloudvoyant/premise-cargo:premise-clap-cli
          path: apps/lgtm-cli
          ci:
              check_platforms: [linux, macos]
          answers:
            name: lgtm-cli
        - name: lgtm-web
          template: cloudvoyant/premise-bun:premise-sveltekit-app
          path: apps/lgtm-web
          ci:
              check_platforms: [linux]
          answers:
            name: lgtm-web
        - name: lgtm-forge
          template: cloudvoyant/premise-cargo:premise-rust-lib
          path: apps/lgtm-forge
          ci:
              check_platforms: [linux]
          answers:
            name: lgtm-forge
        - name: lgtm-db
          template: cloudvoyant/premise-cargo:premise-rust-lib
          path: libs/lgtm-db
          ci:
              check_platforms: [linux]
          answers:
            name: lgtm-db
