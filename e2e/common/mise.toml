# Template contract tasks and generated-project Rust toolchain.

[tools]
rust = { version = "1.88", components = "rustfmt,clippy,rust-analyzer" }

[tasks.install]
description = "Resolve and fetch Cargo dependencies"
run = "cargo fetch"

[tasks.build]
description = "Compile the shared e2e crate"
run = "cargo build"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

[tasks.test]
description = "No tests directly; this crate is a library of fixtures"
run = "cargo test"

[tasks.lint]
description = "Lint with clippy (deny warnings)"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."lint:fix"]
description = "Auto-fix clippy findings"
run = "cargo clippy --fix --allow-dirty --allow-staged --allow-no-vcs"

[tasks.format]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check formatting without modifying files"
run = "cargo fmt --all --check"

[tasks.env-pull]
description = "No env to pull"
run = 'echo "env-pull: nothing to pull"'

[tasks."publish:rc"]
description = "No crate publication"
run = 'echo "publish:rc: not configured"'

[tasks.publish]
description = "No crate publication"
run = 'echo "publish: not configured"'

[tasks.run]
description = "No run surface"
run = 'echo "run: library crate"'

[tasks.dev]
description = "No run surface"
run = 'echo "dev: library crate"'

[tasks.deploy]
description = "No deployable surface"
run = 'echo "deploy: no deployable surface"'

[tasks.e2e]
description = "No direct e2e surface"
run = 'echo "e2e: library crate"'
