[package]
name = "lgtm-e2e-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Shared fixtures and helpers for the lgtm end-to-end tests."
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
git2 = { version = "0.19", default-features = false }

lgtm-grpc = { path = "../../libs/lgtm-grpc" }
