[tasks.test]
depends = ["//apps/lgtm-forge:build"]
description = "Readable TypeScript backend E2E journeys"
dir = "{{config_root}}/../.."
run = "bun x vitest run --config e2e/backend/vitest.config.ts"

[tasks.lint]
dir = "{{config_root}}/../.."
run = "bun x eslint e2e/backend e2e/common"

[tasks.format]
dir = "{{config_root}}/../.."
run = "bun x prettier --write e2e/backend/**/*.ts e2e/common/**/*.ts"

[tasks."format:check"]
dir = "{{config_root}}/../.."
run = "bun x prettier --check e2e/backend/**/*.ts e2e/common/**/*.ts"

[tasks.list]
description = "List the backend BDD journeys without running them"
dir = "{{config_root}}/../.."
run = "bun x vitest list --config e2e/backend/vitest.config.ts"

[tasks.smoke]
depends = ["//apps/lgtm-forge:build"]
description = "Run representative backend E2E flows for local iteration"
dir = "{{config_root}}/../.."
run = "bun x vitest run --config e2e/backend/vitest.config.ts --tags-filter=smoke --hideSkippedTests"
