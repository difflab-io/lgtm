[tools]
rust = { version = "1.88", components = "rustfmt,clippy,rust-analyzer" }

[tasks.install]
description = "Resolve and fetch Cargo dependencies"
run = "cargo fetch"

[tasks.build]
description = "Build the e2e grpc test crate"
run = "cargo build --tests"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

[tasks.test]
description = "Run the gRPC e2e tests (spawns lgtm-server per TestEnv)"
depends = ["//apps/lgtm-server:build"]
run = "cargo test"

[tasks.lint]
description = "Lint with clippy (deny warnings)"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."lint:fix"]
description = "Auto-fix clippy findings"
run = "cargo clippy --fix --allow-dirty --allow-staged --allow-no-vcs"

[tasks.format]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check formatting without modifying files"
run = "cargo fmt --all --check"

[tasks.env-pull]
description = "No env to pull"
run = 'echo "env-pull: nothing to pull"'

[tasks."publish:rc"]
description = "No publication"
run = 'echo "publish:rc: not configured"'

[tasks.publish]
description = "No publication"
run = 'echo "publish: not configured"'

[tasks.run]
description = "No run surface"
run = 'echo "run: tests-only crate"'

[tasks.dev]
description = "No run surface"
run = 'echo "dev: tests-only crate"'

[tasks.deploy]
description = "No deployable surface"
run = 'echo "deploy: no deployable surface"'

[tasks.e2e]
description = "Alias for test"
depends = ["//apps/lgtm-server:build"]
run = "cargo test"
