[package]
name = "lgtm-e2e-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "End-to-end tests for the lgtm-cli binary against a live server."
license = "MIT"
publish = false

[[test]]
name = "subcommands"
path = "tests/subcommands.rs"

[dev-dependencies]
anyhow = { workspace = true }
assert_cmd = "2"
predicates = "3"
serde_json = "1"
lgtm-e2e-common = { path = "../common" }
