[tasks.test]
description = "Run real-process cli end-to-end workflows"
depends = ["//apps/lgtm-cli:build"]
run = "cargo test -p lgtm-e2e-cli"

[tasks."format:check"]
run = "cargo fmt -p lgtm-e2e-cli --check"

[tasks.format]
run = "cargo fmt -p lgtm-e2e-cli"

[tasks.lint]
depends = ["//apps/lgtm-cli:bundle"]
run = "cargo clippy -p lgtm-e2e-cli --all-targets -- -D warnings"
