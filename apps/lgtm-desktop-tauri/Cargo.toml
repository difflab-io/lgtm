[package]
name = "lgtm-desktop-tauri"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal placeholder-backed Tauri v2 application template."
license = "MIT"
publish = false

[lib]
name = "lgtm_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
