[tools]
bun = "1.4.2"
buf = "1.73.0"

[tasks.install]
description = "Install Bun dependencies"
run = "bun install"

[tasks.build]
description = "Build the static web application"
depends = ["generate"]
run = "bun run build"

[tasks.clean]
description = "Remove build artifacts"
run = "bun run clean"

[tasks.test]
description = "Run the Bun test suite against the built backend"
depends = ["install", "//apps/lgtm-backend:build"]
run = "bun run test"

[tasks.lint]
description = "Type-check the application"
depends = ["install"]
dir = "{{ config_root }}/.."
run = [
  "bunx --no-install eslint --config ../eslint.config.js \"$MISE_PROJECT_ROOT\" --no-warn-ignored",
  "mise run -C \"$MISE_PROJECT_ROOT\" typecheck",
]

[tasks."lint:fix"]
description = "Format and type-check the application"
depends = ["install", "format"]
dir = "{{ config_root }}/.."
run = [
  "bunx --no-install eslint --config ../eslint.config.js \"$MISE_PROJECT_ROOT\" --fix --no-warn-ignored",
  "mise run -C \"$MISE_PROJECT_ROOT\" lint",
]

[tasks.format]
description = "Format project files"
depends = ["install"]
dir = "{{ config_root }}/.."
run = "bunx --no-install prettier --ignore-path ../.prettierignore --plugin=prettier-plugin-svelte --write \"$MISE_PROJECT_ROOT\""

[tasks."format:check"]
description = "Check project formatting"
depends = ["install"]
dir = "{{ config_root }}/.."
run = "bunx --no-install prettier --ignore-path ../.prettierignore --plugin=prettier-plugin-svelte --check \"$MISE_PROJECT_ROOT\""

[tasks.env-pull]
description = "Pull external environment configuration"
run = 'echo "env-pull: nothing to pull"'

[tasks."publish:rc"]
description = "Report deferred prerelease publication"
run = 'echo "publish:rc: npm publication is not configured"'

[tasks.publish]
description = "Report deferred stable publication"
run = 'echo "publish: npm publication is not configured"'

[tasks.run]
description = "Run the application"
depends = ["install"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  bun run build
else
  bun run start
fi
'''

[tasks.dev]
description = "Run the application in development mode"
depends = ["generate"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  bun run build
else
  bun run dev
fi
'''

[tasks.deploy]
description = "Report deferred deployment"
run = 'echo "deploy: no deployment target configured"'

[tasks.typecheck]
description = "Run project-specific type checks"
hide = true
dir = "{{ config_root }}"
run = 'bunx --no-install svelte-kit sync && bunx --no-install svelte-check --tsconfig ./tsconfig.json'

[tasks.generate]
description = "Regenerate the web RPC client from the backend Protobuf schema"
depends = ["install"]
run = ["buf lint ../lgtm-backend/proto", "buf generate ../lgtm-backend/proto --template buf.gen.yaml --path ../lgtm-backend/proto/lgtm/v1/hello.proto --path ../lgtm-backend/proto/lgtm/v1/review.proto"]
