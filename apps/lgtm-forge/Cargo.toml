[package]
name = "lgtm-forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "LGTM backend library and Connect RPC server."
repository = "https://github.com/difflab-io/lgtm"

publish = false
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
buffa = { version = "0.9", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["server", "json"] }
connectrpc-health = { version = "0.9.0", default-features = false }
dirs = "6"
gix = { version = "0.70", default-features = false, features = ["basic", "index", "worktree-mutation"] }
lgtm-db = { path = "../../libs/lgtm-db" }
octocrab = { version = "0.44", default-features = false, features = ["default-client", "rustls", "rustls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
thiserror = "2.0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
connectrpc = { version = "0.9.1", default-features = false, features = ["client"] }
connectrpc-health = "0.9.0"
tempfile = "3"

[build-dependencies]
connectrpc-build = "0.9.0"
