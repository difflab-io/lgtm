syntax = "proto3";
package lgtm.v1;

// Logical attribution is separate from the local GitHub posting account.
message Actor {
  string id = 1;
  string name = 2;
  string kind = 3;
  string email = 4;
  string model = 5;
  string provider = 6;
}

message EnsureIdentityRequest {
  string name = 1;
  string email = 2;
  string model = 3;
  string provider = 4;
}

service IdentityService {
  rpc EnsureIdentity(EnsureIdentityRequest) returns (EnsureIdentityResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// Location only: general, file or line; side: old/new. Source identifies the saved bytes.
message Anchor {
  string snapshot_id = 10;
  string kind = 1;
  string path = 2;
  int64 start = 3;
  int64 end = 4;
  string side = 5;
  AnchorSource source = 8;
  AnchorEvidence evidence = 9;
}

message Comment {
  string id = 1;
  string thread_id = 2;
  string context_id = 3;
  string origin_session_id = 4;
  Actor author = 5;
  string body = 6;
  int64 position = 7;
  string visibility = 8;
  string posting_status = 9;
  string created_at = 10;
  string updated_at = 11;
  string forge_comment_id = 12;
  reserved 13;
  reserved "remote_presence";
  string version = 14;
  string owner_id = 15;
  reserved 16;
  reserved "deleted";
  string source_note_id = 17;
}

message Thread {
  Anchor display_location = 12;
  string display_status = 13;
  string id = 1;
  Anchor anchor = 2;
  string state = 3;
  reserved 4;
  reserved "outdated";
  Actor author = 5;
  string forge_thread_id = 6;
  string current_path = 7;
  string orphan_reason = 8;
  ForgeObservation forge_observation = 9;
  string version = 10;
  // Immutable absolute saved-file origin for notes; empty for repository-relative anchors.
  string source_path = 11;
}

message AddCommentRequest {
  reserved 1;
  reserved "session_id";
  string body = 2;
  Anchor anchor = 3;
  ReviewScope scope = 4;
  string expected_version = 5;
  string request_key = 6;
}

message ReplyRequest {
  reserved 1;
  reserved "session_id";
  string thread_id = 2;
  string body = 3;
  ReviewScope scope = 4;
  string expected_version = 5;
  string request_key = 6;
}

message EditCommentRequest {
  reserved 1;
  reserved "session_id";
  string comment_id = 2;
  string body = 3;
  ReviewScope scope = 4;
  string expected_version = 5;
  string request_key = 6;
}

message DeleteCommentRequest {
  reserved 1;
  reserved "session_id";
  string comment_id = 2;
  ReviewScope scope = 3;
  string expected_version = 4;
  string request_key = 5;
}

message ResolveThreadRequest {
  reserved 1;
  reserved "session_id";
  string thread_id = 2;
  bool resolved = 3;
  ReviewScope scope = 4;
  string expected_version = 5;
  string request_key = 6;
}

message ExportRequest {
  reserved 1;
  reserved "session_id";
  repeated string comment_ids = 2;
  ReviewScope scope = 3;
}

message ExportResponse {
  string markdown = 1;
}

message ListPullRequestsRequest {
  string repository_url = 1;
  string query = 2;
  uint32 page = 3;
}

message PullRequest {
  int64 number = 1;
  string title = 2;
  string head = 3;
  string base = 4;
  string repository_url = 5;
}

message ListPullRequestsResponse {
  repeated PullRequest pull_requests = 1;
  uint32 next_page = 2;
}

message SubmitReviewRequest {
  reserved 1;
  reserved "session_id";
  string outcome = 2;
  string body = 3;
  string request_key = 4;
  string expected_head = 5;
  string review_id = 6;
  string expected_version = 7;
  string expected_base = 8;
}

service ReviewService {
  rpc StartReview(StartReviewRequest) returns (StartReviewResponse);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse);
  rpc GetFileReviews(GetFileReviewsRequest) returns (GetFileReviewsResponse);
  rpc SetFileReviewed(SetFileReviewedRequest) returns (SetFileReviewedResponse);
  rpc RefreshReview(RefreshReviewRequest) returns (RefreshReviewResponse);
  rpc CompleteReview(CompleteReviewRequest) returns (CompleteReviewResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc SyncDraftComment(SyncDraftCommentRequest) returns (SyncDraftCommentResponse);
  rpc Reply(ReplyRequest) returns (ReplyResponse);
  rpc EditComment(EditCommentRequest) returns (EditCommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc ResolveThread(ResolveThreadRequest) returns (ResolveThreadResponse);
  rpc Export(ExportRequest) returns (ExportResponse);
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse);
  rpc SubmitReview(SubmitReviewRequest) returns (SubmitReviewResponse);
  rpc ReconcileSubmission(ReconcileSubmissionRequest) returns (ReconcileSubmissionResponse);
}

message EnsureIdentityResponse {
  Actor actor = 1;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  string api_version = 1;
  repeated string capabilities = 2;
}

message GetConversationRequest {
  string snapshot_id = 20;
  reserved 1;
  reserved "context_id";
  optional bool include_drafts = 2;
  ReviewScope scope = 3;
  repeated string file_paths = 4;
  string page_token = 5;
  uint32 page_size = 6;
}

message GetConversationResponse {
  reserved 1;
  reserved "context";
  reserved 2;
  reserved "sessions";
  repeated Thread threads = 3;
  repeated Comment comments = 4;
  string version = 5;
  string next_page_token = 6;
}

message SyncDraftCommentRequest {
  reserved 1;
  reserved "session_id";
  string comment_id = 2;
  string review_id = 3;
  reserved 4;
  reserved "request_key";
}

message SyncDraftCommentResponse {
  Comment comment = 1;
}

message AddCommentResponse {
  Comment comment = 1;
  // Local save succeeded. A nonempty error means GitHub synchronization failed.
  string sync_error = 2;
}

message ReplyResponse {
  Comment comment = 1;
  string sync_error = 2;
}

message EditCommentResponse {
  Comment comment = 1;
}

message DeleteCommentResponse { string accepted_version = 1; }

message ResolveThreadResponse {
  Thread thread = 1;
}

message SubmitReviewResponse {
  reserved 1;
  reserved "session";
  Review review = 2;
}

message ReconcileSubmissionRequest {
  reserved 1;
  reserved "session_id";
  string review_id = 2;
  reserved 3;
  reserved "request_key";
}

message ReconcileSubmissionResponse {
  reserved 1;
  reserved "session";
  Review review = 2;
}

// Typed consumer intent. Storage records are resolved inside the backend.
message LocalGitTarget { string path = 1; string branch = 2; }

message DirectoryTarget { string path = 1; }

message PullRequestTarget { string repository_url = 1; int64 number = 2; }

message ReviewTarget {
  oneof kind {
    LocalGitTarget local_git = 1;
    DirectoryTarget directory = 2;
    PullRequestTarget pull_request = 3;
  }
}

message WorkingComparison { string base_commit = 1; }

message StagedComparison { string base_commit = 1; }

message BranchComparison { string base_commit = 1; string head_commit = 2; }

message DirectoryComparison {}

message PullRequestComparison { string base_commit = 1; string head_commit = 2; }

message ReviewComparison {
  oneof kind {
    WorkingComparison working = 1;
    StagedComparison staged = 2;
    BranchComparison branch = 3;
    DirectoryComparison directory = 4;
    PullRequestComparison pull_request = 5;
  }
}

message NotesScope { string path = 1; }

message ReviewScope {
  oneof kind { string review_id = 1; NotesScope notes = 2; }
}

message CommitSource { string sha = 1; string content_hash = 2; }

message IndexFileSource { string blob_oid = 1; string content_hash = 2; }

message WorkingFileSource { string content_hash = 1; }

message LocalFileSource { string content_hash = 1; }

message AnchorSource {
  oneof kind {
    CommitSource commit = 1;
    IndexFileSource index_file = 2;
    WorkingFileSource working_file = 3;
    LocalFileSource local_file = 4;
  }
}

message AnchorEvidence {
  string selected_text = 1;
  string context_before = 2;
  string context_after = 3;
}

message ForgeObservation {
  string base = 1;
  string head = 2;
  bool outdated = 3;
  Anchor current = 4;
}

// Backend-owned immutable Git source. Existing commit identities are retained.
message ReviewSnapshot {
  string id = 1;
  string repository_id = 2;
  string root = 3;
  string base_commit = 4;
  string head_commit = 5;
}

message Review {
  string id = 1;
  ReviewTarget target = 2;
  ReviewComparison comparison = 3;
  string state = 4;
  string version = 5;
  Actor creator = 6;
  string created_at = 7;
  string outcome = 8;
  string body = 9;
  string submission_status = 10;
  string submission_error = 11;
  string forge_review_id = 12;
  string forge_state = 13;
  ReviewComparison observed_comparison = 14;
  ReviewSnapshot snapshot = 30;
  repeated ReviewSnapshot revisions = 31;
}

enum ResumePolicy {
  RESUME_POLICY_UNSPECIFIED = 0;
  RESUME_POLICY_MATCHING_ONLY = 1;
  RESUME_POLICY_REPLACE_LOCAL = 2;
  RESUME_POLICY_ACCEPT_PR_COMPARISON = 3;
}

message StartReviewRequest {
  ReviewTarget target = 1;
  ReviewComparison comparison = 2;
  string request_key = 3;
  // MATCHING_ONLY resumes only the same recorded comparison.
  ResumePolicy resume_policy = 4;
  string expected_review_id = 5;
  string expected_version = 6;
  // Optional local checkout for source validation without forge content downloads.
  string local_git_path = 7;
}

message StartReviewResponse { Review review = 1; }

message GetReviewRequest { string review_id = 1; }

message GetReviewResponse { Review review = 1; }

message ListReviewsRequest {
  ReviewTarget target = 1;
  string state = 2;
  string page_token = 3;
  uint32 page_size = 4;
}

message ListReviewsResponse { repeated Review reviews = 1; string next_page_token = 2; }

// Only confirmed client observations may change path association or orphan state.
message RefreshReviewRequest {
  ReviewScope scope = 1;
  string expected_version = 2;
  string request_key = 4;
}

message RefreshReviewResponse { Review review = 1; string version = 2; }

message CompleteReviewRequest {
  string review_id = 1;
  string body = 2;
  string expected_version = 3;
  string request_key = 4;
}

message CompleteReviewResponse { Review review = 1; }

// Local marks include the exact comparison content; PR marks are authoritative GitHub viewer state.
message FileReview { string path = 1; string content_identity = 2; }

message GetFileReviewsRequest { string review_id = 1; }

message GetFileReviewsResponse { repeated FileReview files = 1; }

message SetFileReviewedRequest { string review_id = 1; string path = 2; bool reviewed = 3; string content_identity = 4; }

message SetFileReviewedResponse {}
