syntax = "proto3";
package lgtm.v1;

import "lgtm/v1/review.proto";

// A transient comparison descriptor. It has no review ID or database ownership.
message DiffDescriptor {
  ReviewTarget target = 1;
  ReviewComparison comparison = 2;
  string root = 3;
  string observation_token = 4;
}

message DiffFile {
  string path = 1;
  string previous_path = 2;
  string status = 3;
  string identity = 4;
}

message ContentSide {
  string path = 1;
  AnchorSource source = 2;
  string content = 3;
}

message SuppliedAnchor {
  Anchor original = 1;
  string current_path = 2;
  ForgeObservation forge_observation = 3;
}

// A source displayed by a client. Content is absent for a missing file side.
// Native editors may supply Git/filesystem bytes without changing their buffers.
message AnchorView {
  string path = 1;
  string logical_path = 2;
  string previous_path = 3;
  string side = 4;
  bool confirmed_rename = 5;
  AnchorSource source = 6;
  optional string content = 7;
  ReviewComparison comparison = 8;
  bool historical = 9;
  string unavailable = 10;
}

message GetAnchorPlacementsRequest {
  repeated SuppliedAnchor anchors = 1;
  repeated AnchorView views = 2;
  bool notes = 3;
}

message GetAnchorPlacementsResponse { repeated AnchorPlacement placements = 1; }

message CaptureAnchorRequest {
  Anchor location = 1;
  oneof selection {
    GetSourceRequest saved = 2;
    GetFileRequest file = 3;
  }
  string side = 4;
}

message CaptureAnchorResponse { Anchor anchor = 1; }

enum SavedSourceKind {
  SAVED_SOURCE_KIND_UNSPECIFIED = 0;
  SAVED_SOURCE_KIND_COMMIT = 1;
  SAVED_SOURCE_KIND_INDEX = 2;
  SAVED_SOURCE_KIND_WORKING = 3;
  SAVED_SOURCE_KIND_LOCAL = 4;
}

// Read one explicit saved source, including files outside the current changed-file list.
message GetSourceRequest {
  string root = 1;
  string path = 2;
  SavedSourceKind kind = 3;
  string commit = 4;
}

// selected is absent for a confirmed missing file. Failed reads return an error.
message GetSourceResponse { ContentSide selected = 1; }

message ConfirmedPlacement {
  Anchor location = 1;
  AnchorSource displayed_source = 2;
}

message UnplacedAnchor { string reason = 1; }

message AnchorPlacement {
  uint32 index = 1;
  oneof kind {
    ConfirmedPlacement exact = 2;
    ConfirmedPlacement relocated = 3;
    UnplacedAnchor outdated = 4;
    UnplacedAnchor orphaned = 5;
    UnplacedAnchor unverified = 6;
    UnplacedAnchor stale = 7;
  }
  string side = 8;
}

message GetDiffRequest {
  ReviewTarget target = 1;
  ReviewComparison comparison = 2;
}

message GetDiffResponse { DiffDescriptor diff = 1; }

message GetFilesRequest {
  DiffDescriptor diff = 1;
  string page_token = 2;
  uint32 page_size = 3;
}

message GetFilesResponse {
  repeated DiffFile files = 1;
  string next_page_token = 2;
}

message GetFileRequest {
  DiffDescriptor diff = 1;
  string path = 2;
  repeated SuppliedAnchor anchors = 3;
}

message GetFileResponse {
  DiffFile file = 1;
  ContentSide old_side = 2;
  ContentSide new_side = 3;
  repeated AnchorPlacement placements = 4;
}

service DiffService {
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse);
  rpc GetFiles(GetFilesRequest) returns (GetFilesResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc GetAnchorPlacements(GetAnchorPlacementsRequest) returns (GetAnchorPlacementsResponse);
  rpc CaptureAnchor(CaptureAnchorRequest) returns (CaptureAnchorResponse);
  rpc GetSource(GetSourceRequest) returns (GetSourceResponse);
}
