[package]
name = "lgtm-desktop-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "GPUI desktop shell for the lgtm review PoC."
license = "MIT"
publish = false

# Standalone workspace — see root Cargo.toml for the reason.
[workspace]

[dependencies]
anyhow = "1"
env_logger = "0.11"
# Zed's gpui and gpui_platform are not yet published in the shape the current
# examples use; pin to a known-good commit on main so the API shape matches.
gpui = { git = "https://github.com/zed-industries/zed", rev = "f0b38ac" }
# `font-kit` is off by default in gpui_platform; without it, gpui_macos emits
# "no text will be rendered" at startup. Turn it on.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f0b38ac", features = ["font-kit"] }

# Blocking HTTP client for talking to lgtm-server. Blocking keeps the client
# code tiny and avoids a tokio runtime inside the GPUI event loop.
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# syntect loads SublimeText syntaxes at startup; good enough for the small set
# of languages the fixture repo exercises.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
