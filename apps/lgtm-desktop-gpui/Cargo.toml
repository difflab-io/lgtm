[package]
name = "lgtm-desktop-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "GPUI desktop shell for the lgtm review PoC."
license = "MIT"
publish = false

# Standalone workspace — see root Cargo.toml for the reason.
[workspace]

[dependencies]
anyhow = "1"
env_logger = "0.11"

# gpui-kit bundles the `gpui-pre` fork of GPUI plus the gpui-component widget
# library (Input, Textarea, Button, etc.) and default assets. `use gpui_kit::*;`
# is GPUI.
gpui-kit = { version = "0.7", features = ["component", "assets"] }

# Blocking HTTP client for talking to lgtm-server.
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# syntect loads SublimeText syntaxes at startup; good enough for the small set
# of languages the fixture repo exercises.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
