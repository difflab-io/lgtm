# Template contract tasks and generated-project Rust toolchain.

[tools]
rust = { version = "1.88", components = "rustfmt,clippy,rust-analyzer" }
"cargo:cargo-zigbuild" = "0.23.4"
zig = "0.16.0"

[tasks.install]
description = "Resolve and fetch Cargo dependencies"
run = "cargo fetch"

[tasks.build]
depends = ["bundle"]
description = "Compile the CLI"
run = "cargo build"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"

[tasks.test]
depends = ["bundle"]
description = "Run the test suite"
run = "cargo test"

[tasks.lint]
depends = ["bundle"]
description = "Lint with clippy (deny warnings)"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."lint:fix"]
depends = ["bundle"]
description = "Auto-fix clippy findings"
run = "cargo clippy --fix --allow-dirty --allow-staged --allow-no-vcs"

[tasks.format]
depends = ["bundle"]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."format:check"]
depends = ["bundle"]
description = "Check formatting without modifying files"
run = "cargo fmt --all --check"

[tasks.env-pull]
description = "Pull external environment configuration"
run = 'echo "env-pull: nothing to pull"'

[tasks."publish:rc"]
depends = ["bundle"]
description = "Publish a prerelease (rc) version of the crate"
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  echo "publish:rc (test mode): cargo publish --dry-run --allow-dirty"
  cargo publish --dry-run --allow-dirty
  exit 0
fi
version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
case "$version" in
  *-*) ;;
  *) echo "error: publish:rc requires a SemVer prerelease version (got $version)" >&2; exit 1 ;;
esac
cargo publish --allow-dirty --no-verify
'''

[tasks.publish]
depends = ["bundle"]
description = "Publish a stable version of the crate"
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  echo "publish (test mode): cargo publish --dry-run --allow-dirty"
  cargo publish --dry-run --allow-dirty
  exit 0
fi
version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
case "$version" in
  *-*) echo "error: publish requires a stable version (got $version)" >&2; exit 1 ;;
esac
cargo publish --allow-dirty --no-verify
'''

[tasks.run]
depends = ["bundle"]
description = "Run the CLI"
run = "cargo run --"

[tasks.dev]
depends = ["bundle"]
description = "Run the CLI in development mode"
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  cargo build
else
  cargo run --
fi
'''

[tasks.deploy]
description = "Validate the deploy contract (no deployable surface)"
run = 'echo "deploy: no deployable surface"'

[tasks.e2e]
description = "Validate the e2e contract (no end-to-end surface)"
run = 'echo "e2e: no end-to-end surface"'

[tasks.bundle]
description = "Bundle the private backend and web UI into the publishable CLI"
depends = ["//apps/lgtm-backend:build", "//apps/lgtm-web:build"]
run = '''
bun run - <<'JS'
import { cp, mkdir, readFile, rename, rm, writeFile } from 'node:fs/promises'
import { join, resolve } from 'node:path'

const cli = process.cwd()
const root = resolve(cli, '../..')
const result = Bun.spawnSync(['cargo', 'build', '-p', 'lgtm-backend', '--message-format=json'], {
  cwd: root,
  stdout: 'pipe',
  stderr: 'inherit',
})
if (result.exitCode !== 0) throw new Error('Backend build failed')
const messages = result.stdout
  .toString()
  .trim()
  .split('\n')
  .map((line) => JSON.parse(line))
const generated = messages.find(
  (message) =>
    message.reason === 'build-script-executed' && message.package_id.includes('lgtm-backend'),
)?.out_dir
if (!generated) throw new Error('Backend did not report generated Protobuf output')

const stage = join(cli, '.bundle-stage')
await rm(stage, { recursive: true, force: true })
await mkdir(stage)
await cp(join(root, 'apps/lgtm-backend/src/lib.rs'), join(stage, 'backend.rs'))
await cp(generated, join(stage, 'proto'), { recursive: true })
await cp(join(root, 'apps/lgtm-web/build'), join(stage, 'web'), { recursive: true })
// Fail before replacing the previous bundle if the web build is incomplete.
await readFile(join(stage, 'web/index.html'))
await writeFile(
  join(stage, 'README.md'),
  'Generated from lgtm-backend and lgtm-web by the CLI bundle task.\n',
)
await rm(join(cli, 'bundle'), { recursive: true, force: true })
await rename(stage, join(cli, 'bundle'))
console.log('Bundled backend source, generated Protobuf types, and static web UI into lgtm-cli')
JS
'''
