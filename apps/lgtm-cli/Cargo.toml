[package]
name = "lgtm-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Command-line review client, task runner, and desktop launcher for LGTM."
repository = "https://github.com/difflab-io/lgtm"
publish = false
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md"]
license = "Apache-2.0"

[[bin]]
name = "lgtm"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["lgtm-db/sqlite"]
postgres = ["lgtm-db/postgres"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["http2"] }
buffa = { version = "0.9", features = ["json"] }
clap = { version = "4.6.6", features = ["derive"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["server", "json", "axum", "client"] }
dirs = "6"
fs2 = "0.4"
lgtm-config = { path = "../../libs/lgtm-config" }
lgtm-db = { path = "../../libs/lgtm-db" }
lgtm-env = { path = "../../libs/lgtm-env" }
lgtm-forge = { path = "../lgtm-forge" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
daemonize = "0.5.0"
nix = { version = "0.30.1", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
