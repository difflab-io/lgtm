[package]
name = "lgtm-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Run LGTM code reviews with a bundled web UI and gRPC server."
repository = "https://github.com/difflab-io/lgtm"
publish = ["crates-io"]
include = ["src/**", "tests/**", "build.rs", "bundle/**", "Cargo.toml", "Cargo.lock", "README.md"]
license = "Apache-2.0"

[[bin]]
name = "lgtm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
axum = { version = "0.8", features = ["http2"] }
buffa = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["server", "json", "axum"] }
connectrpc-health = { version = "0.9.0", default-features = false }
dirs = "6"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5.0"

[build-dependencies]
mime_guess = "2"

[dev-dependencies]
connectrpc = { version = "0.9.1", default-features = false, features = ["client"] }
tempfile = "3"
