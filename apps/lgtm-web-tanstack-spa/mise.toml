[tools]
bun = "1.4.2"

[tasks.install]
description = "Install Bun dependencies"
run = "bun install"

[tasks.build]
description = "Build the application"
depends = ["install"]
run = "bun run build"

[tasks.clean]
description = "Remove build artifacts"
run = "bun run clean"

[tasks.test]
description = "Run the Bun test suite"
depends = ["install"]
run = "bun run test"

[tasks.lint]
description = "Type-check the application"
depends = ["install"]
run = "bun run lint"

[tasks."lint:fix"]
description = "Format and type-check the application"
depends = ["install"]
run = "bun run lint:fix"

[tasks.format]
description = "Format project files"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check project formatting"
depends = ["install"]
run = "bun run format:check"

[tasks.env-pull]
description = "Pull external environment configuration"
run = 'echo "env-pull: nothing to pull"'

[tasks."publish:rc"]
description = "Report deferred prerelease publication"
run = 'echo "publish:rc: npm publication is not configured"'

[tasks.publish]
description = "Report deferred stable publication"
run = 'echo "publish: npm publication is not configured"'

[tasks.run]
description = "Run the application"
depends = ["install"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  bun run build
else
  bun run start
fi
'''

[tasks.dev]
description = "Run the application in development mode"
depends = ["install"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  bun run build
else
  bun run dev
fi
'''

[tasks.deploy]
description = "Report deferred deployment"
run = 'echo "deploy: no deployment target configured"'

[tasks.e2e]
description = "Run the finite application smoke test"
depends = ["install"]
run = "sh -c 'bun run test'"
