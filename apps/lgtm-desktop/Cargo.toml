[package]
name = "lgtm-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LGTM desktop application shell and local workspace service."
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
lgtm-config = { path = "../../libs/lgtm-config" }
lgtm-lsp = { path = "../../libs/lgtm-lsp" }
lgtm-project = { path = "../../libs/lgtm-project" }
lgtm-session = { path = "../../libs/lgtm-session" }
lgtm-workspace = { path = "../../libs/lgtm-workspace" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "0.0.13"
tauri = { version = "=2.11.6", features = [] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "=2.11.6", features = ["test"] }
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
e2e-bridge = ["tauri/test"]
