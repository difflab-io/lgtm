[package]
name = "lgtm-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LGTM desktop application shell and local workspace service."
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
lgtm-config = { path = "../../libs/lgtm-config" }
lgtm-lsp = { path = "../../libs/lgtm-lsp" }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.11.6", features = [] }
trash = "=5.2.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tauri = { version = "=2.11.6", features = ["test"] }
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
e2e-bridge = ["tauri/test"]
