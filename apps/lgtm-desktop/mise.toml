# Template contract tasks, generated-project Rust toolchain, and native host packages.

[tools]
rust = { version = "1.94.0", components = "rustfmt,clippy,rust-analyzer" }
"cargo:tauri-cli" = "2.11.5"

[bootstrap.packages]
"apt:libwebkit2gtk-4.1-dev" = "latest"
"apt:libayatana-appindicator3-dev" = "latest"
"apt:librsvg2-dev" = "latest"
"apt:libxdo-dev" = "latest"
"apt:libssl-dev" = "latest"
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:wget" = "latest"
"apt:file" = "latest"

[tasks."hc:stage"]
description = "Fetch and stage the pinned herdr-core (hc) Tauri sidecar binary"
run = '''
set -eu
HC_VERSION="0.1.21"
os="$(uname -s)"
arch="$(uname -m)"
case "$os:$arch" in
  Darwin:arm64|Darwin:aarch64)
    triple="aarch64-apple-darwin"
    url="https://releases.herdr.dev/core/${HC_VERSION}/herdr-core-macos-aarch64.tar.gz"
    want="1ab38dd9270f63a8f794d6d60e8702eb0d1c85a72bda85d735e5eea43f05ffed"
    ;;
  Darwin:x86_64)
    triple="x86_64-apple-darwin"
    url="https://releases.herdr.dev/core/${HC_VERSION}/herdr-core-macos-x86_64.tar.gz"
    want="e377e1d342cddce0346da5b2f3c281b9701e4731c00024c7c5028265e77a217f"
    ;;
  Linux:aarch64|Linux:arm64)
    triple="aarch64-unknown-linux-gnu"
    url="https://releases.herdr.dev/core/${HC_VERSION}/herdr-core-linux-aarch64.tar.gz"
    want="e844a2bfab48a226097679d076bc83042fe57fccef5387ef802e5b24e78b529a"
    ;;
  Linux:x86_64|Linux:amd64)
    triple="x86_64-unknown-linux-gnu"
    url="https://releases.herdr.dev/core/${HC_VERSION}/herdr-core-linux-x86_64.tar.gz"
    want="78424755c10a40dde38a0bdb55c20ac19706e9ae05ed68fc2acf1fcff0d941c1"
    ;;
  *)
    echo "hc:stage: unsupported host ${os}:${arch}" >&2
    exit 1
    ;;
esac

dest="binaries/hc-${triple}"
stamp="binaries/hc-${triple}.version"
if [ -x "$dest" ] && [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$HC_VERSION" ]; then
  echo "hc:stage: ${dest} (${HC_VERSION}) already staged"
  exit 0
fi

mkdir -p binaries
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
curl -fsSL "$url" -o "$tmp/herdr-core.tar.gz"
if command -v sha256sum >/dev/null 2>&1; then
  got="$(sha256sum "$tmp/herdr-core.tar.gz" | cut -d' ' -f1)"
else
  got="$(shasum -a 256 "$tmp/herdr-core.tar.gz" | cut -d' ' -f1)"
fi
if [ "$got" != "$want" ]; then
  echo "hc:stage: sha256 mismatch (got ${got}, want ${want})" >&2
  exit 1
fi
tar -xzf "$tmp/herdr-core.tar.gz" -C "$tmp"
src_bin="$(find "$tmp" -type f \( -name 'herdr-core' -o -name 'hc' \) | head -n 1)"
if [ -z "$src_bin" ]; then
  echo "hc:stage: herdr-core binary not found in archive" >&2
  exit 1
fi
cp "$src_bin" "$dest"
chmod +x "$dest"
printf '%s' "$HC_VERSION" > "$stamp"
echo "hc:stage: staged ${dest} (${HC_VERSION})"
'''
run_windows = '''#!/usr/bin/env pwsh
$ErrorActionPreference = 'Stop'
$hcVersion = '0.1.21'
$triple = 'x86_64-pc-windows-msvc'
$url = "https://releases.herdr.dev/core/$hcVersion/herdr-core-windows-x86_64.zip"
$want = 'a8984634c35b58ba82d0aec078d5a5e6004da01d5a25b3daf822ab5e31c7312b'
$dest = "binaries/hc-$triple.exe"
$stamp = "binaries/hc-$triple.version"
if ((Test-Path -LiteralPath $dest) -and (Test-Path -LiteralPath $stamp) -and ((Get-Content -Raw $stamp).Trim() -eq $hcVersion)) {
  Write-Output "hc:stage: $dest ($hcVersion) already staged"
  exit 0
}
New-Item -ItemType Directory -Force -Path binaries | Out-Null
$tmp = Join-Path ([IO.Path]::GetTempPath()) "lgtm-hc-$PID"
New-Item -ItemType Directory -Force -Path $tmp | Out-Null
try {
  $zip = Join-Path $tmp 'herdr-core.zip'
  curl.exe -fsSL $url -o $zip
  if ($LASTEXITCODE -ne 0) { throw "download failed: $url" }
  $stream = [IO.File]::OpenRead($zip)
  try {
    $sha = [Security.Cryptography.SHA256]::Create()
    $got = ([BitConverter]::ToString($sha.ComputeHash($stream)) -replace '-', '').ToLowerInvariant()
  } finally {
    $stream.Dispose()
  }
  if ($got -ne $want) { throw "sha256 mismatch (got $got, want $want)" }
  & (Join-Path $env:SystemRoot 'System32\tar.exe') -xf $zip -C $tmp
  $srcBin = Get-ChildItem -LiteralPath $tmp -Recurse -File | Where-Object { $_.Name -in @('herdr-core.exe', 'hc.exe') } | Select-Object -First 1
  if (-not $srcBin) { throw 'herdr-core.exe not found in archive' }
  Copy-Item -LiteralPath $srcBin.FullName -Destination $dest -Force
  Set-Content -LiteralPath $stamp -Value $hcVersion -NoNewline
  Write-Output "hc:stage: staged $dest ($hcVersion)"
} finally {
  Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue
}
'''

[tasks.install]
description = "Install native packages, stage hc sidecar, and fetch Cargo dependencies"
depends = ["hc:stage"]
run = '''
set -eu
if command -v apt-get >/dev/null 2>&1; then
  if command -v sudo >/dev/null 2>&1; then
    sudo apt-get -o DPkg::Lock::Timeout=120 update
  else
    apt-get -o DPkg::Lock::Timeout=120 update
  fi
  mise bootstrap packages apply --manager apt
else
  echo "install: apt-get unavailable; skipping Debian/Ubuntu native packages"
fi
cargo fetch --manifest-path Cargo.toml
'''
run_windows = "cargo fetch --manifest-path Cargo.toml"

[tasks.build]
description = "Compile the Tauri application without bundling"
depends = ["install"]
run = "cargo tauri build --debug --no-bundle"

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean --manifest-path Cargo.toml"

[tasks.test]
description = "Run the Rust test suite"
depends = ["install", "//apps/lgtm-web:build"]
run = "cargo test --manifest-path Cargo.toml"

[tasks.lint]
description = "Lint with clippy (deny warnings)"
depends = ["install", "//apps/lgtm-web:build"]
run = "cargo clippy --manifest-path Cargo.toml --all-targets --all-features -- -D warnings"

[tasks."lint:fix"]
description = "Auto-fix clippy findings"
depends = ["install", "//apps/lgtm-web:build"]
run = "cargo clippy --manifest-path Cargo.toml --fix --allow-dirty --allow-staged --allow-no-vcs"

[tasks.format]
description = "Format Rust sources"
run = "cargo fmt --manifest-path Cargo.toml -p lgtm-desktop"

[tasks."format:check"]
description = "Check formatting without modifying files"
run = "cargo fmt --manifest-path Cargo.toml -p lgtm-desktop --check"

[tasks.env-pull]
description = "Pull external environment configuration"
run = 'echo "env-pull: nothing to pull"'

[tasks.release]
description = "Build native installers and hand them off for the requested mode"
depends = ["install"]
usage = 'arg "<mode>" { choices "build" "publish" "publish:rc" }'
# WiX/MSI rejects the rc.<number> SemVer suffix; RC builds use NSIS only.
run = [
  '''{% if env.PREMISE_TEMPLATE_TEST == "1" %}cargo tauri build --debug --no-bundle{% else %}set -eu
: "${RELEASE_VERSION:?RELEASE_VERSION is required}"
: "${PREMISE_ARTIFACT_DIR:?PREMISE_ARTIFACT_DIR is required}"
mkdir -p target
printf '{"version":"%s"}\n' "$RELEASE_VERSION" > target/premise-release-config.json
mkdir -p "$PREMISE_ARTIFACT_DIR"{% endif %}''',
  '''{% if env.PREMISE_TEMPLATE_TEST == "1" %}echo release test mode{% else %}set -eu
target_dir="$(cargo metadata --manifest-path Cargo.toml --no-deps --format-version 1 | jq -r .target_directory)"
rm -rf "$target_dir/release/bundle"
cargo tauri build --bundles {% if os() == "windows" %}{% if usage.mode == "publish:rc" %}nsis{% elif env.PREMISE_RELEASE_CHANNEL == "rc" %}nsis{% else %}msi,nsis{% endif %}{% elif os() == "macos" %}dmg{% else %}deb,appimage{% endif %} --config target/premise-release-config.json{% endif %}''',
  '''{% if env.PREMISE_TEMPLATE_TEST == "1" %}echo release test mode{% else %}set -eu
target_dir="$(cargo metadata --manifest-path Cargo.toml --no-deps --format-version 1 | jq -r .target_directory)"
bundle_dir="$target_dir/release/bundle"
[ -d "$bundle_dir" ]
{% if os() == "linux" %}find "$bundle_dir" -type f \( -name '*.deb' -o -name '*.AppImage' \) -size +0c -exec cp "{}" "$PREMISE_ARTIFACT_DIR/" \;{% elif os() == "macos" %}find "$bundle_dir" -type f -name '*.dmg' -size +0c -exec cp "{}" "$PREMISE_ARTIFACT_DIR/" \;{% elif usage.mode == "publish:rc" or env.PREMISE_RELEASE_CHANNEL == "rc" %}find "$bundle_dir" -type f -name '*.exe' -size +0c -exec cp "{}" "$PREMISE_ARTIFACT_DIR/" \;{% else %}find "$bundle_dir" -type f \( -name '*.msi' -o -name '*.exe' \) -size +0c -exec cp "{}" "$PREMISE_ARTIFACT_DIR/" \;{% endif %}
{% endif %}''',
]
# Mise defaults to cmd.exe on Windows. Shebangs select PowerShell for these
# native scripts instead of running Bash syntax in cmd.exe.
run_windows = [
  '''#!/usr/bin/env pwsh
{% if env.PREMISE_TEMPLATE_TEST == "1" %}cargo tauri build --debug --no-bundle{% else %}$ErrorActionPreference = 'Stop'
if (-not $env:RELEASE_VERSION) { throw 'RELEASE_VERSION is required' }
if (-not $env:PREMISE_ARTIFACT_DIR) { throw 'PREMISE_ARTIFACT_DIR is required' }
New-Item -ItemType Directory -Force -Path target, $env:PREMISE_ARTIFACT_DIR | Out-Null
'{"version":"' + $env:RELEASE_VERSION + '"}' | Set-Content -Encoding utf8 target/premise-release-config.json{% endif %}''',
  '''#!/usr/bin/env pwsh
{% if env.PREMISE_TEMPLATE_TEST == "1" %}Write-Output 'release test mode'{% else %}$ErrorActionPreference = 'Stop'
$metadata = cargo metadata --manifest-path Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
$bundleDir = Join-Path $metadata.target_directory 'release/bundle'
if (Test-Path -LiteralPath $bundleDir) { Remove-Item -LiteralPath $bundleDir -Recurse -Force }
cargo tauri build --bundles {% if usage.mode == "publish:rc" or env.PREMISE_RELEASE_CHANNEL == "rc" %}nsis{% else %}msi,nsis{% endif %} --config target/premise-release-config.json
if ($LASTEXITCODE -ne 0) { throw 'cargo tauri build failed' }{% endif %}''',
  '''#!/usr/bin/env pwsh
{% if env.PREMISE_TEMPLATE_TEST == "1" %}Write-Output 'release test mode'{% else %}$ErrorActionPreference = 'Stop'
$metadata = cargo metadata --manifest-path Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
$bundleDir = Join-Path $metadata.target_directory 'release/bundle'
if (-not (Test-Path -LiteralPath $bundleDir)) { throw 'release bundle directory is missing' }
$extensions = {% if usage.mode == "publish:rc" or env.PREMISE_RELEASE_CHANNEL == "rc" %}@('.exe'){% else %}@('.msi', '.exe'){% endif %}
$files = @(Get-ChildItem -LiteralPath $bundleDir -Recurse -File | Where-Object { $_.Extension -in $extensions })
if ($files.Count -eq 0) { throw 'no installers were built' }
foreach ($file in $files) {
  if ($file.Length -eq 0) { throw "empty installer: $($file.FullName)" }
  Copy-Item -LiteralPath $file.FullName -Destination $env:PREMISE_ARTIFACT_DIR
}
{% endif %}''',
]

[tasks."release:build"]
description = "Build native installers for a platform release"
run = "mise run release -- build"

[tasks.publish]
description = "Build and upload stable installers to the existing GitHub Release"
run = "mise run release -- publish"

[tasks."publish:rc"]
description = "Build and upload RC installers to an existing GitHub prerelease"
run = "mise run release -- publish:rc"

[tasks.run]
description = "Run the Tauri application"
depends = ["install"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  cargo tauri build --debug --no-bundle
else
  mise run dev
fi
'''

[tasks.dev]
description = "Run the Tauri application in development mode"
depends = ["install"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = "1" ]; then
  cargo tauri build --debug --no-bundle
elif [ "$(uname -s)" = "Darwin" ] && [ "$(launchctl managername 2>/dev/null || true)" != "Aqua" ]; then
  uid="$(id -u)"
  label="io.difflab.lgtm.desktop.dev.$$"
  tmp_dir="$(mktemp -d "${TMPDIR:-/tmp}/lgtm-aqua.XXXXXX")"
  plist="$tmp_dir/$label.plist"
  out_log="$tmp_dir/out.log"
  done_file="$tmp_dir/done"
  : > "$out_log"
  tail -n +1 -f "$out_log" &
  tail_pid=$!
  cleanup() {
    launchctl bootout "gui/$uid/$label" >/dev/null 2>&1 || true
    kill "$tail_pid" >/dev/null 2>&1 || true
    rm -rf "$tmp_dir"
  }
  trap cleanup INT TERM EXIT
  cat > "$plist" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Label</key>
  <string>$label</string>
  <key>EnvironmentVariables</key>
  <dict>
    <key>PATH</key>
    <string>$PATH</string>
    <key>HOME</key>
    <string>$HOME</string>
    <key>CARGO_HOME</key>
    <string>${CARGO_HOME:-$HOME/.cargo}</string>
    <key>RUSTUP_HOME</key>
    <string>${RUSTUP_HOME:-$HOME/.rustup}</string>
    <key>LGTM_HOME</key>
    <string>${LGTM_HOME:-}</string>
    <key>LGTM_WORKSPACE</key>
    <string>${LGTM_WORKSPACE:-}</string>
    <key>LGTM_BACKEND_URL</key>
    <string>${LGTM_BACKEND_URL:-}</string>
    <key>RUST_LOG</key>
    <string>${RUST_LOG:-}</string>
  </dict>
  <key>ProgramArguments</key>
  <array>
    <string>/bin/sh</string>
    <string>-c</string>
    <string>cargo tauri dev; echo \$? > "$done_file"</string>
  </array>
  <key>WorkingDirectory</key>
  <string>$PWD</string>
  <key>StandardOutPath</key>
  <string>$out_log</string>
  <key>StandardErrorPath</key>
  <string>$out_log</string>
  <key>RunAtLoad</key>
  <true/>
  <key>AbandonProcessGroup</key>
  <false/>
</dict>
</plist>
EOF
  launchctl bootstrap "gui/$uid" "$plist"
  while [ ! -f "$done_file" ]; do
    sleep 0.2
  done
  rc="$(cat "$done_file")"
  sleep 0.1
  exit "$rc"
else
  cargo tauri dev
fi
'''

[tasks.deploy]
description = "Validate the deploy contract (no deployable surface)"
run = 'echo "deploy: no deployable surface"'

[tasks.e2e]
description = "Validate the e2e contract (no end-to-end surface)"
run = 'echo "e2e: no end-to-end surface"'
