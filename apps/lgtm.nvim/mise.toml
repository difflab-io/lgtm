[tools]
stylua = "2.1.0"
neovim = "0.12.5"

[tasks.test]
description = "Plugin syntax and public contract checks"
run = "nvim --headless -u NONE -l {{config_root}}/tests/contracts.lua"

[tasks.lint]
run = "nvim --headless -u NONE -l {{config_root}}/tests/contracts.lua"

[tasks.format]
run = "stylua {{config_root}}/lua {{config_root}}/plugin {{config_root}}/tests"

[tasks."format:check"]
run = "stylua --check {{config_root}}/lua {{config_root}}/plugin {{config_root}}/tests"
