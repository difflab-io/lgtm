[package]
name = "lgtm-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LGTM herdr-core (hc) terminal client, Kitty inline rewriter, and dynamic agent detector."
repository = "https://github.com/difflab-io/lgtm"
publish = false
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
lgtm-env = { path = "../lgtm-env" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
