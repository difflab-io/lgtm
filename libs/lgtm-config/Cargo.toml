[package]
name = "lgtm-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LGTM global and workspace configuration, language detection, and managed mise file generation."
repository = "https://github.com/difflab-io/lgtm"
publish = false
license = "Apache-2.0"

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
