[package]
name = "lgtm-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LGTM desktop session persistence, project registry, and per-workspace tab retention."
repository = "https://github.com/difflab-io/lgtm"
publish = false
license = "Apache-2.0"

[dependencies]
lgtm-project = { path = "../lgtm-project" }
lgtm-rsutils = { path = "../lgtm-rsutils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile = "3"
