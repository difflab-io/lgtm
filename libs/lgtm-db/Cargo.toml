[package]
name = "lgtm-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "LGTM persistence layer for identities, reviews, sessions, and comments."
repository = "https://github.com/difflab-io/lgtm"
publish = false
license = "Apache-2.0"

[features]
default = ["sqlite"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
