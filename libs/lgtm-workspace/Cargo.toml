[package]
name = "lgtm-workspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LGTM local workspace directory browsing, file CRUD, and active checkout state management."
repository = "https://github.com/difflab-io/lgtm"
publish = false
license = "Apache-2.0"

[dependencies]
lgtm-config = { path = "../lgtm-config" }
lgtm-lsp = { path = "../lgtm-lsp" }
lgtm-project = { path = "../lgtm-project" }
lgtm-session = { path = "../lgtm-session" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
trash = "=5.2.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
