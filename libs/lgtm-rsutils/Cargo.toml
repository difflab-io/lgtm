[package]
name = "lgtm-rsutils"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Stateless Git path resolution, worktree CLI, slug hashing, atomic file write, and URL normalization utilities for LGTM."
repository = "https://github.com/difflab-io/lgtm"
publish = false
license = "Apache-2.0"

[dependencies]
sha2 = "0.10"
thiserror = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
