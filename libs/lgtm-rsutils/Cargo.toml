[package]
name = "lgtm-rsutils"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Domain-agnostic Git, path slug, atomic file write, and URL normalization extension utilities."
repository = "https://github.com/difflab-io/lgtm"
publish = false
license = "Apache-2.0"

[dependencies]
gix = { version = "0.70", default-features = false, features = ["basic"] }
url = "2"

[dev-dependencies]
tempfile = "3"
