[package]
name = "lgtm-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LGTM Language Server Protocol client and Mise-backed server orchestration SDK."
repository = "https://github.com/difflab-io/lgtm"
publish = false
license = "Apache-2.0"

[dependencies]
lgtm-config = { path = "../lgtm-config" }
lgtm-env = { path = "../lgtm-env" }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
