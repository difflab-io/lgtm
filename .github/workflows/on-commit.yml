name: On Commit

"on":
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      runner: ${{ steps.plan.outputs.runner }}
      matrix: ${{ steps.plan.outputs.matrix }}
      native: ${{ steps.plan.outputs.native }}
      version: ${{ steps.plan.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: cloudvoyant/premise@v0
        id: plan
        with:
          command: plan
          flow: on-commit
          release: auto
          install-premise: build
      - name: Run the root hook once before matrix rows
        if: steps.plan.outputs.mode == 'matrix'
        uses: cloudvoyant/premise@v0
        with:
          command: flow
          flow: on-commit
          release: none
          root-only: true
          install-premise: skip

  single:
    needs: plan
    if: needs.plan.outputs.mode == 'single'
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Run complete flow
        uses: cloudvoyant/premise@v0
        with:
          command: flow
          flow: on-commit
          release: none
          install-premise: build
          channel: rc
          version: ${{ needs.plan.outputs.version }}
          output-dir: ${{ runner.temp }}/premise-files
      - uses: actions/upload-artifact@v4
        with:
          name: single
          path: ${{ runner.temp }}/premise-files/
          if-no-files-found: ignore
          retention-days: 7

  matrix:
    needs: plan
    if: needs.plan.outputs.mode != 'single'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner || needs.plan.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Run scoped complete flow
        uses: cloudvoyant/premise@v0
        with:
          command: flow-matrix
          flow: on-commit
          release: none
          install-premise: build
          project: ${{ matrix.project }}
          platform: ${{ matrix.platform }}
          skip-root: true
          channel: rc
          version: ${{ needs.plan.outputs.version }}
          output-dir: ${{ runner.temp }}/premise-files
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/premise-files/
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    needs: [plan, single, matrix]
    outputs:
      version: ${{ needs.plan.outputs.version }}
    if: >-
      always() && needs.plan.outputs.version != '' &&
      needs.plan.result == 'success' &&
      ((needs.plan.outputs.mode == 'single' &&
        needs.single.result == 'success') ||
       (needs.plan.outputs.mode != 'single' &&
        needs.matrix.result == 'success'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: >-
          needs.plan.outputs.mode == 'single' &&
          needs.plan.outputs.native == 'true'
        with:
          name: single
          path: ${{ runner.temp }}/premise-files
      - uses: actions/download-artifact@v4
        if: >-
          needs.plan.outputs.mode == 'matrix' &&
          needs.plan.outputs.native == 'true'
        with:
          pattern: "*-*"
          path: ${{ runner.temp }}/premise-files
          merge-multiple: false
      - name: Keep the release checkout clean
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo '::error::Release checkout is dirty before tagging'
            exit 1
          fi
      - name: Publish combined release
        uses: cloudvoyant/premise@v0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: release
          flow: on-commit
          release: none
          install-premise: build
          channel: rc
          version: ${{ needs.plan.outputs.version }}
          files-dir: ${{ needs.plan.outputs.native == 'true' && format('{0}/premise-files', runner.temp) || '' }}

  publish-packages:
    needs: publish-release
    if: >-
      always() && needs.publish-release.result == 'success' &&
      needs.publish-release.outputs.version != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish registry packages
        uses: cloudvoyant/premise@v0
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          command: packages
          flow: on-commit
          release: none
          install-premise: build
          channel: rc
          version: ${{ needs.publish-release.outputs.version }}
