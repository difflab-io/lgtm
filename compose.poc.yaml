name: lgtm-pglite-poc
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lgtm
      POSTGRES_PASSWORD: lgtm-poc
      POSTGRES_DB: lgtm_sync
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgtm -d lgtm_sync"]
      interval: 1s
      timeout: 3s
      retries: 60
  sync:
    build:
      context: .
      dockerfile: Dockerfile.poc
    environment:
      LGTM_SYNC_ADDR: "0.0.0.0:8090"
      LGTM_SYNC_DATABASE_URL: "postgres://lgtm:lgtm-poc@postgres/lgtm_sync"
      LGTM_SYNC_USERS: '{"poc-alice":"11111111-1111-4111-8111-111111111111","poc-bob":"22222222-2222-4222-8222-222222222222"}'
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres:
