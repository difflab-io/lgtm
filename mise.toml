# Workspace-level mise configuration generated by premise, plus PoC-local
# convenience tasks that start the backend and each app.

monorepo_root = true

[env]
_.path = ["{{config_root}}/bin"]
LGTM_ADDR = "127.0.0.1:50051"
LGTM_REPO = "{{config_root}}/.tmp/repos/ripgrep"
LGTM_BASE = "HEAD~5"

[monorepo]
# GPUI is excluded from fan-out tasks until the Metal toolchain is installed;
# `mise run lgtm:build:gpui` builds it explicitly when the user is ready.
config_roots = [
    "apps/lgtm-cli",
    "apps/lgtm-desktop-tauri",
    "apps/lgtm-server",
    "apps/lgtm-web-tanstack-spa",
    "e2e/*",
    "libs/*",
]

[tasks."lgtm:build"]
description = "Build the Rust workspace and the web app"
run = [
  "cargo build --workspace --exclude lgtm-desktop-gpui",
  "cd apps/lgtm-web-tanstack-spa && bun install && bun run build",
]

[tasks."lgtm:build:gpui"]
description = "Build the GPUI desktop app (slow first time)"
# GPUI is a standalone workspace; `-p` from the root workspace can't find it.
run = "cd apps/lgtm-desktop-gpui && cargo build"

[tasks."lgtm:cli"]
description = "Run the lgtm CLI (positional args pass through)"
run = "cargo run -q -p lgtm-cli --"

[tasks."lgtm:serve"]
description = "Run the lgtm Connect-JSON server in the foreground"
run = "cargo run -p lgtm-server"

[tasks."lgtm:run:web"]
description = "Dev-serve the TanStack SPA (expects lgtm:serve in another shell)"
run = "cd apps/lgtm-web-tanstack-spa && bun run dev"

[tasks."lgtm:dev:web"]
description = "Start lgtm-server + web dev server together; Ctrl-C stops both"
run = '''
set -eu
# Build server first so the first launch isn't racing cargo build.
cargo build -p lgtm-server
# Start server in background; trap exits so we always clean up.
RUST_LOG="${RUST_LOG:-info}" ./target/debug/lgtm-server &
backend_pid=$!
trap 'kill "$backend_pid" 2>/dev/null || true' EXIT INT TERM
# Give the server a beat to bind the socket.
sleep 0.5
cd apps/lgtm-web-tanstack-spa && bun run dev
'''

[tasks."lgtm:run:tauri"]
description = "Run the Tauri desktop shell (expects lgtm:serve in another shell)"
# `cd` so the project's mise.toml activates — that's where `cargo:tauri-cli` is pinned.
run = "cd apps/lgtm-desktop-tauri && cargo tauri dev"

[tasks."lgtm:run:gpui"]
description = "Run the GPUI desktop app (expects lgtm:serve in another shell)"
depends = ["lgtm:build:gpui"]
run = "cd apps/lgtm-desktop-gpui && cargo run"
