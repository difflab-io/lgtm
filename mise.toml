# Workspace-level mise configuration generated by premise.
# Project lifecycle tasks are addressed with `mise run '//...:<task>'`.

monorepo_root = true

[env]
# Keep Git diagnostics stable and Unicode fixtures usable on both CI platforms.
LC_ALL = "{% if os() == 'macos' %}en_US.UTF-8{% else %}C.UTF-8{% endif %}"

[monorepo]
config_roots = ["apps/*", "libs/*", "e2e/backend", "e2e/cli", "e2e/nvim", "e2e/sync"]

[tools]
buf = "1.73.0"
rust = { version = "1.94.0", components = "rustfmt,clippy,rust-analyzer" }
bun = "1.4.2"
node = "26.10.0"
goreleaser = "2.18.1"
"cargo:cargo-zigbuild" = "0.23.4"
zig = "0.16.0"

[tasks.install]
run = ["cargo fetch", "bun install --frozen-lockfile"]

[tasks.build]
depends = ["//apps/lgtm-cli:bundle"]
run = ["cargo build --workspace", "bun run --filter lgtm-web build"]

[tasks.test]
depends = ["//apps/lgtm-cli:bundle", "//apps/lgtm.nvim:test", "e2e:typecheck"]
run = ["cargo test --workspace", "bun run --filter lgtm-web test"]

[tasks.lint]
depends = ["//apps/lgtm-cli:bundle", "//apps/lgtm.nvim:lint", "e2e:lint"]
run = ["cargo clippy --workspace --all-targets --all-features -- -D warnings", "mise run //apps/lgtm-web:lint"]

[tasks.format]
depends = ["//apps/lgtm-cli:bundle", "//apps/lgtm.nvim:format", "e2e:format"]
run = ["cargo fmt --all", "mise run //apps/lgtm-web:format"]

[tasks."format:check"]
depends = ["//apps/lgtm-cli:bundle", "//apps/lgtm.nvim:format:check", "e2e:format:check"]
run = ["cargo fmt --all --check", "mise run //apps/lgtm-web:format:check"]

[tasks."run:cli"]
depends = ["//apps/lgtm-cli:bundle"]
description = "Run the LGTM CLI"
alias = "dev:cli"
run = "cargo run -p lgtm-cli --bin lgtm --"

[tasks."dev:backend"]
run = "mise run //apps/lgtm-backend:dev"

[tasks."dev:web"]
run = "mise run //apps/lgtm-web:dev"

[tasks."release:check"]
depends = ["//apps/lgtm-cli:bundle"]
description = "Validate CLI-only release configuration and Cargo packaging"
run = ["goreleaser check --config .goreleaser.yaml", "cargo publish -p lgtm-cli --dry-run --allow-dirty --locked"]

[tasks."release:cli"]
depends = ["//apps/lgtm-cli:bundle"]
description = "Publish only lgtm-cli archives from a release tag"
run = "goreleaser release --config .goreleaser.yaml --clean"

[tasks."publish:cli"]
depends = ["//apps/lgtm-cli:bundle"]
description = "Publish only lgtm-cli to crates.io"
run = "cargo publish -p lgtm-cli --locked"

[tasks.dev]
description = "Run the backend watcher and web development server together"
depends = ["//apps/lgtm-backend:dev", "//apps/lgtm-web:dev"]

[tasks."test:postgres"]
description = "Run database and backend contracts on SQLite and PostgreSQL"
run = "mise run //:with-postgres -- cargo test --locked -p lgtm-db -p lgtm-backend --all-features"

[tasks."e2e:backend"]
description = "Run backend E2E tests"
usage = 'flag "--extended" help="Include extended tests"'
run = 'LGTM_E2E_EXTENDED="${usage_extended:-false}" mise run //e2e/backend:test'

[tasks."e2e:cli"]
description = "Run cli E2E tests"
usage = 'flag "--extended" help="Include extended tests"'
run = 'LGTM_E2E_EXTENDED="${usage_extended:-false}" mise run //e2e/cli:test'

[tasks."e2e:nvim"]
description = "Run nvim E2E tests"
usage = 'flag "--extended" help="Include extended tests"'
run = '''
export LGTM_E2E_EXTENDED="${usage_extended:-false}"
if [ "$LGTM_E2E_EXTENDED" = true ]; then
  export LGTM_E2E_NVIM_PROFILES="${LGTM_E2E_NVIM_PROFILES:-required,kak}"
fi
mise run //e2e/nvim:test
'''

[tasks.e2e]
description = "Run E2E suites in parallel"
usage = 'flag "--extended" help="Include extended tests"'
run = '''
export LGTM_E2E_EXTENDED="${usage_extended:-false}"
if [ "$LGTM_E2E_EXTENDED" = true ]; then
  export LGTM_E2E_NVIM_PROFILES="${LGTM_E2E_NVIM_PROFILES:-required,kak}"
fi
mise run --continue-on-error //:e2e:fixtures:test ::: //e2e/backend:test ::: //e2e/cli:test ::: //e2e/nvim:test
'''

[tasks."nvim:lint"]
depends = ["//apps/lgtm.nvim:lint"]

[tasks."nvim:install-dev-plugin"]
description = "Point Neovim's local LGTM plugin at this checkout"
run = "mise run //apps/lgtm.nvim:install-plugin --source worktree"

[tasks."nvim:install-released-plugin"]
description = "Install the latest LGTM plugin from main"
run = "mise run //apps/lgtm.nvim:install-plugin --source main"

[tasks."nvim:format"]
depends = ["//apps/lgtm.nvim:format"]

[tasks."nvim:format:check"]
depends = ["//apps/lgtm.nvim:format:check"]

[tasks."nvim:test"]
depends = ["//apps/lgtm.nvim:test"]

[tasks."e2e:format"]
run = "bun x prettier --write 'e2e/{common,backend,cli,nvim}/**/*.ts' e2e/tsconfig.json"

[tasks."e2e:format:check"]
run = "bun x prettier --check 'e2e/{common,backend,cli,nvim}/**/*.ts' e2e/tsconfig.json"

[tasks."e2e:typecheck"]
run = "bun x tsc -p e2e/tsconfig.json"

[tasks."e2e:lint"]
run = "bun x eslint e2e/common e2e/backend e2e/cli e2e/nvim"

[tasks."e2e:nvim:run"]
description = "Run editor journeys against existing binaries without rebuilding"
run = "bun x vitest run --config e2e/nvim/vitest.config.ts"

[tasks."e2e:list"]
description = "List local BDD journeys without running them"
depends = ["//e2e/backend:list", "//e2e/cli:list", "//e2e/nvim:list"]

[tasks."e2e:backend:run"]
description = "Run backend journeys against existing binaries without rebuilding"
run = "bun x vitest run --config e2e/backend/vitest.config.ts"

[tasks."e2e:cli:run"]
description = "Run CLI journeys against existing binaries without rebuilding"
run = "bun x vitest run --config e2e/cli/vitest.config.ts"

[tasks."e2e:smoke"]
description = "Run representative E2E flows across backend, CLI and Neovim"
run = "mise run --continue-on-error //e2e/backend:smoke ::: //e2e/cli:smoke ::: //e2e/nvim:smoke"

[tasks."e2e:fixtures:test"]
description = "Verify strict HTTP replay, UUID binding and mutation barriers without GitHub"
run = "bun x vitest run e2e/common/github-cassette.test.ts"

[tasks."e2e:record"]
description = "Refresh genuine GitHub recordings for a suite and optional Vitest filter"
run = '''
#!/usr/bin/env bash
set -euo pipefail
suite=${1:?Use e2e:record -- backend|cli|nvim|all [Vitest filters]}
shift
export LGTM_E2E_GITHUB_MODE=record
export LGTM_E2E_EXTENDED=true
export LGTM_E2E_NVIM_PROFILES="${LGTM_E2E_NVIM_PROFILES:-required}"
case "$suite" in
  backend|cli|nvim) exec mise run "//e2e/$suite:test" -- "$@" ;;
  all)
    if [ "$#" -ne 0 ]; then echo "Select a suite to apply Vitest filters" >&2; exit 2; fi
    # Record suites serially, with shared build dependencies, to avoid API bursts.
    exec mise run --jobs 1 --continue-on-error //e2e/backend:test ::: //e2e/cli:test ::: //e2e/nvim:test
    ;;
  *) echo 'Suite must be backend, cli, nvim, or all' >&2; exit 2 ;;
esac
'''

[tasks."poc:build"]
description = "Build the PGlite local backend and separate sync service"
run = "cargo build -p lgtm-backend -p lgtm-sync-service"

[tasks."poc:format"]
run = "cargo fmt -p lgtm-db -p lgtm-backend -p lgtm-sync -p lgtm-sync-service"

[tasks."poc:lint"]
run = "cargo clippy --locked -p lgtm-db -p lgtm-backend -p lgtm-sync -p lgtm-sync-service --all-targets -- -D warnings"

[tasks."poc:postgres"]
description = "Start persistent cloud PostgreSQL on localhost:55432"
run = "docker compose -f compose.poc.yaml up -d --wait postgres"

[tasks."poc:cloud"]
description = "Run the separate sync service against Docker PostgreSQL"
env.LGTM_SYNC_DATABASE_URL = "{{env.LGTM_SYNC_DATABASE_URL | default(value='postgres://lgtm:lgtm-poc@127.0.0.1:55432/lgtm_sync')}}"
env.LGTM_SYNC_USERS = '{"poc-alice":"11111111-1111-4111-8111-111111111111","poc-bob":"22222222-2222-4222-8222-222222222222"}'
run = "cargo run --locked -p lgtm-sync-service"

[tasks."poc:device-a"]
description = "Local PGlite backend on port 8081, signed in as Alice"
env.LGTM_HOME = "{{config_root}}/.poc/device-a"
env.LGTM_BACKEND_ADDR = "127.0.0.1:8081"
env.LGTM_SYNC_URL = "http://127.0.0.1:8090"
env.LGTM_SYNC_TOKEN = "poc-alice"
run = "cargo run --locked -p lgtm-backend"

[tasks."poc:device-b"]
description = "Second persistent PGlite device on port 8082, signed in as Alice"
env.LGTM_HOME = "{{config_root}}/.poc/device-b"
env.LGTM_BACKEND_ADDR = "127.0.0.1:8082"
env.LGTM_SYNC_URL = "http://127.0.0.1:8090"
env.LGTM_SYNC_TOKEN = "poc-alice"
run = "cargo run --locked -p lgtm-backend"

[tasks."poc:local"]
description = "Anonymous local PGlite backend on port 8083"
env.LGTM_HOME = "{{config_root}}/.poc/anonymous"
env.LGTM_BACKEND_ADDR = "127.0.0.1:8083"
run = "env -u LGTM_SYNC_URL -u LGTM_SYNC_TOKEN cargo run --locked -p lgtm-backend"

[tasks."poc:test"]
description = "Run sync persistence contracts and PGlite process journeys"
run = ["cargo test --locked -p lgtm-db --test sync_repository", "mise run //:poc-test-remote"]

[tasks."poc:install"]
description = "Install the existing TypeScript test dependencies"
run = "bun install --frozen-lockfile"

[tasks."poc:ts-format"]
run = "bun x prettier --write e2e/sync/*.ts e2e/tsconfig.json"

[tasks."poc:ts-lint"]
run = "bun x eslint e2e/sync e2e/common/test-utils.ts"

[tasks."poc:cli-check"]
depends = ["//apps/lgtm-cli:bundle"]
run = "cargo check --locked -p lgtm-cli --all-features"
