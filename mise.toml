# Workspace-level mise configuration generated by premise.
# Project lifecycle tasks are addressed with `mise run '//...:<task>'`.

monorepo_root = true

[env]
# Keep Git diagnostics stable and Unicode fixtures usable on both CI platforms.
LC_ALL = "{% if os() == 'macos' %}en_US.UTF-8{% else %}C.UTF-8{% endif %}"

[monorepo]
config_roots = ["apps/*", "libs/*", "e2e/forge", "e2e/cli", "e2e/nvim", "e2e/desktop"]

[tools]
buf = "1.73.0"
rust = { version = "1.94.0", components = "rustfmt,clippy,rust-analyzer" }
bun = "1.4.2"
node = "24"
goreleaser = "2.18.1"
"cargo:cargo-zigbuild" = "0.23.4"
zig = "0.16.0"

[tasks.install]
run = ["cargo fetch", "bun install"]

[tasks.build]
run = [
  "cargo build --workspace",
  "bun run --filter lgtm-ui build",
  "bun run --filter lgtm-web build",
]

[tasks.test]
depends = ["//apps/lgtm.nvim:test", "e2e:typecheck"]
run = [
  "cargo test --workspace",
  "mise run //apps/lgtm-desktop:test",
  "bun run --filter lgtm-ui test",
  "bun run --filter lgtm-web test",
]

[tasks.lint]
depends = ["//apps/lgtm.nvim:lint", "e2e:lint", "//e2e/desktop:lint"]
run = [
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "mise run //apps/lgtm-desktop:lint",
  "mise run //libs/lgtm-ui:lint",
  "mise run //apps/lgtm-web:lint",
]

[tasks.format]
depends = ["//apps/lgtm.nvim:format", "e2e:format", "//e2e/desktop:format"]
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path apps/lgtm-desktop/Cargo.toml -p lgtm-desktop",
  "mise run //libs/lgtm-ui:format",
  "mise run //apps/lgtm-web:format",
]

[tasks."format:check"]
depends = ["//apps/lgtm.nvim:format:check", "e2e:format:check", "//e2e/desktop:format:check"]
run = [
  "cargo fmt --all --check",
  "cargo fmt --manifest-path apps/lgtm-desktop/Cargo.toml -p lgtm-desktop --check",
  "mise run //libs/lgtm-ui:format:check",
  "mise run //apps/lgtm-web:format:check",
]

[tasks."run:cli"]
description = "Run the LGTM CLI"
alias = "dev:cli"
run = "cargo run -p lgtm-cli --bin lgtm --"

[tasks."dev:backend"]
run = "mise run //apps/lgtm-forge:dev"

[tasks."dev:web"]
run = "mise run //apps/lgtm-web:dev"

[tasks."dev:desktop"]
description = "Run the LGTM desktop application in development mode"
run = "mise run //apps/lgtm-desktop:dev"

[tasks."release:check"]
description = "Validate CLI-only release configuration and Cargo compilation"
run = ["goreleaser check --config .goreleaser.yaml", "cargo check -p lgtm-cli --locked"]

[tasks."release:cli"]
description = "Publish only lgtm-cli archives from a release tag"
run = "goreleaser release --config .goreleaser.yaml --clean"

[tasks."publish:cli"]
description = "Private package; publication disabled (binary-only release via release:cli)"
run = 'echo "Private package; publication disabled"'

[tasks.dev]
description = "Run the backend watcher and desktop development application together"
run = '''
set -eu
eval "$(node -e '
const net = require("node:net");
function pickPort(preferred) {
  return new Promise((resolve) => {
    const srv = net.createServer();
    srv.once("error", () => {
      const fb = net.createServer();
      fb.listen(0, "127.0.0.1", () => {
        const port = fb.address().port;
        fb.close(() => resolve(port));
      });
    });
    srv.listen(preferred, "127.0.0.1", () => {
      srv.close(() => resolve(preferred));
    });
  });
}
(async () => {
  const backendPort = await pickPort(8080);
  const webPort = await pickPort(5173);
  console.log(`export LGTM_BACKEND_ADDR="${process.env.LGTM_BACKEND_ADDR || `127.0.0.1:${backendPort}`}"`);
  console.log(`export LGTM_BACKEND_URL="${process.env.LGTM_BACKEND_URL || `http://127.0.0.1:${backendPort}`}"`);
  console.log(`export LGTM_WEB_PORT="${process.env.LGTM_WEB_PORT || webPort}"`);
})();
')"
mise run //apps/lgtm-forge:dev ::: //apps/lgtm-desktop:dev
'''

[tasks."e2e:forge"]
description = "Run forge E2E tests"
alias = "e2e:backend"
usage = 'flag "--extended" help="Include extended tests"'
run = 'LGTM_E2E_EXTENDED="${usage_extended:-false}" mise run //e2e/forge:test'

[tasks."e2e:cli"]
description = "Run cli E2E tests"
usage = 'flag "--extended" help="Include extended tests"'
run = 'LGTM_E2E_EXTENDED="${usage_extended:-false}" mise run //e2e/cli:test'

[tasks."e2e:nvim"]
description = "Run nvim E2E tests"
usage = 'flag "--extended" help="Include extended tests"'
run = '''
export LGTM_E2E_EXTENDED="${usage_extended:-false}"
if [ "$LGTM_E2E_EXTENDED" = true ]; then
  export LGTM_E2E_NVIM_PROFILES="${LGTM_E2E_NVIM_PROFILES:-required,kak}"
fi
mise run //e2e/nvim:test
'''

[tasks."e2e:desktop"]
description = "Run desktop E2E tests"
run = "mise run //e2e/desktop:test"

[tasks.e2e]
description = "Run E2E suites in parallel"
usage = 'flag "--extended" help="Include extended tests"'
run = '''
export LGTM_E2E_EXTENDED="${usage_extended:-false}"
if [ "$LGTM_E2E_EXTENDED" = true ]; then
  export LGTM_E2E_NVIM_PROFILES="${LGTM_E2E_NVIM_PROFILES:-required,kak}"
fi
mise run --continue-on-error //:e2e:fixtures:test ::: //e2e/forge:test ::: //e2e/cli:test ::: //e2e/nvim:test ::: //e2e/desktop:test
'''

[tasks."nvim:lint"]
depends = ["//apps/lgtm.nvim:lint"]

[tasks."nvim:install-dev-plugin"]
description = "Point Neovim's local LGTM plugin at this checkout"
run = "mise run //apps/lgtm.nvim:install-plugin --source worktree"

[tasks."nvim:install-released-plugin"]
description = "Install the latest LGTM plugin from main"
run = "mise run //apps/lgtm.nvim:install-plugin --source main"

[tasks."nvim:format"]
depends = ["//apps/lgtm.nvim:format"]

[tasks."nvim:format:check"]
depends = ["//apps/lgtm.nvim:format:check"]

[tasks."nvim:test"]
depends = ["//apps/lgtm.nvim:test"]

[tasks."e2e:format"]
run = "bun x prettier --write 'e2e/{common,forge,cli,nvim}/**/*.ts' e2e/tsconfig.json"

[tasks."e2e:format:check"]
run = "bun x prettier --check 'e2e/{common,forge,cli,nvim}/**/*.ts' e2e/tsconfig.json"

[tasks."e2e:typecheck"]
run = "bun x tsc -p e2e/tsconfig.json"

[tasks."e2e:lint"]
run = "bun x eslint e2e/common e2e/forge e2e/cli e2e/nvim"

[tasks."e2e:nvim:run"]
description = "Run editor journeys against existing binaries without rebuilding"
run = "bun x vitest run --config e2e/nvim/vitest.config.ts"

[tasks."e2e:list"]
description = "List local BDD journeys without running them"
depends = ["//e2e/forge:list", "//e2e/cli:list", "//e2e/nvim:list", "//e2e/desktop:list"]

[tasks."e2e:forge:run"]
description = "Run forge journeys against existing binaries without rebuilding"
alias = "e2e:backend:run"
run = "bun x vitest run --config e2e/forge/vitest.config.ts"

[tasks."e2e:cli:run"]
description = "Run CLI journeys against existing binaries without rebuilding"
run = "bun x vitest run --config e2e/cli/vitest.config.ts"

[tasks."e2e:smoke"]
description = "Run representative E2E flows across forge, CLI, Neovim and desktop"
run = "mise run --continue-on-error //e2e/forge:smoke ::: //e2e/cli:smoke ::: //e2e/nvim:smoke ::: //e2e/desktop:smoke"

[tasks."e2e:fixtures:test"]
description = "Verify strict HTTP replay, UUID binding and mutation barriers without GitHub"
run = "bun x vitest run e2e/common/github-cassette.test.ts"

[tasks."e2e:record"]
description = "Record provider journeys when replacement journeys are available"
run = "bun run e2e/common/record.ts"
